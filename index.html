<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AURA</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AURA">
<meta name="theme-color" content="#040310">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,200;0,300;0,400;0,600;0,700;1,200&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Duality: --ac/--ac2/--conf はJSテーマエンジンが毎秒更新 */
  --ac:112,132,166;          /* accent  静寂=黒青 → 高揚=白青 */
  --ac2:142,158,188;         /* secondary 黒青系 → 青白系 */
  --conf:0;                  /* conflict 0..1 */
  --hot:255,88,142;
  --ink:#040310;
  --text:rgba(228,238,252,0.88);
  --dim:rgba(var(--ac2),0.42);
  --font:'Exo 2',sans-serif;
  --mono:'Share Tech Mono',monospace;
  --r:14px;
}

html,body{
  width:100%;height:100%;
  background:var(--ink);
  overflow:hidden;
  color:var(--text);
  font-family:var(--font);
}

/* ── 虚空：二層のオーロラ。光側と紛争側がconfでクロスフェード ── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 95% 60% at 16% -5%, rgba(78,104,150,0.13) 0%, transparent 62%),
    radial-gradient(ellipse 70% 45% at 88% 105%, rgba(96,112,150,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 50%, rgba(7,9,28,1) 35%, rgba(4,3,16,1) 100%);
  opacity:calc(1 - var(--conf)*0.8);
  transition:opacity 0.6s linear;
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 95% 60% at 84% -5%, rgba(214,228,248,0.13) 0%, transparent 62%),
    radial-gradient(ellipse 70% 45% at 10% 105%, rgba(150,82,255,0.13) 0%, transparent 60%);
  opacity:var(--conf);
  transition:opacity 0.6s linear;
}

.app{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  max-width:480px; margin:0 auto;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}

/* ── PCなどポインタがマウスの環境のみ、ダッシュボード風レイアウト ── */
/* スマホ(粗いポインタ=指)や狭いPC画面は元の固定挙動を維持 */
@media (pointer: fine) and (min-width: 1100px) and (min-height: 780px){
  /* 画面内ぴったり収める(スクロール無し、ウィジェット風) */
  html,body{ width:100%; height:100%; overflow:hidden; }

  .app{
    height:100vh; height:100dvh;
    max-width:1280px; margin:0 auto;
    padding:12px 16px;
    gap:8px;
    overflow:hidden;
  }

  /* top-section:残り空間を全部食う。内部はviz中央デカく+右に縦並び情報 */
  .top-section{
    display:grid !important;
    grid-template-columns:minmax(0, 1fr) 300px;
    grid-template-rows:auto 1fr;
    gap:10px;
    padding:0 !important;
    overflow:visible !important;
    height:auto !important;
    flex:1 1 0 !important;
    min-height:0;
  }
  .viz-wrap{
    grid-column:1; grid-row:1 / span 2;
    width:clamp(500px, 64vmin, 600px) !important;
    height:clamp(500px, 64vmin, 600px) !important;
    flex:none !important;
    align-self:center; justify-self:center;
    min-width:0; min-height:0;
  }
  /* right-panel:LUFSとPeakを横並びにして上段に */
  .right-panel{
    grid-column:2; grid-row:1;
    width:auto !important; height:auto !important;
    flex-direction:row !important;
    flex-shrink:0 !important;
    gap:8px;
  }
  .right-panel .meter-card{ flex:1; min-height:108px; }
  /* scroll-wf-card(LIVE):下段で縦長に残りを埋める */
  .scroll-wf-card{
    grid-column:2; grid-row:2;
    width:auto !important; height:auto !important;
    flex-shrink:1 !important;
    min-height:0;
  }

  /* 帯状セクション:固定高さで画面下にきれいに並べる */
  .eq-section{ flex:none; min-height:0; }
  #eqCanvas{ height:80px; }
  .seek-section{ flex:none; min-height:0; }
  .seek-canvas-wrap{ height:52px; }

  /* プレイリスト:固定高さで内部スクロール */
  .playlist-section{ flex:none; min-height:0; max-height:170px; }
  .playlist-list{ max-height:110px; }

  /* プレイヤー:固定 */
  .player{ flex:none; }

  /* プレイリストの個別削除ボタン:タッチ用に出しっぱなしを基本に */
  .pl-del{ opacity:0.45 !important; }
  .pl-item:hover .pl-del{ opacity:1 !important; }

  /* ── PC専用ツールバー(ヘッダー右) ── */
  .pc-tools{ display:flex; gap:4px; align-items:center; margin-right:10px; }
  .pc-btn{
    width:24px; height:24px; padding:0; border-radius:6px;
    background:rgba(var(--ac),0.08); border:1px solid rgba(var(--ac),0.20);
    color:rgba(var(--ac2),0.85); font-size:13px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background 0.15s, transform 0.15s, color 0.15s;
    font-family:var(--mono);
  }
  .pc-btn:hover{ background:rgba(var(--ac),0.18); color:#fff; transform:translateY(-1px); }
  .pc-btn.active{ background:rgba(var(--ac),0.32); color:#fff; }

  /* ── ミニモード:キューブのみフル表示 ── */
  body.mini-mode .scroll-wf-card,
  body.mini-mode .right-panel,
  body.mini-mode .eq-section,
  body.mini-mode .seek-section,
  body.mini-mode .playlist-section,
  body.mini-mode .player{ display:none !important; }
  body.mini-mode .header{ opacity:0.25; transition:opacity 0.3s; }
  body.mini-mode .header:hover{ opacity:1; }
  body.mini-mode .app{ padding:0 !important; gap:0 !important; max-width:none !important; }
  body.mini-mode .top-section{
    grid-template-columns:1fr !important;
    grid-template-rows:1fr !important;
    flex:1 1 0 !important;
    place-items:center;
  }
  body.mini-mode .viz-wrap{
    grid-column:1 !important; grid-row:1 !important;
    width:min(96vh, 96vw) !important;
    height:min(96vh, 96vw) !important;
    max-width:none !important; max-height:none !important;
  }

  /* ── キーボードヘルプモーダル ── */
  .kbd-help{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:rgba(4,3,16,0.78); backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .kbd-help[hidden]{ display:none; }
  .kbd-help-inner{
    background:rgba(8,10,28,0.92);
    border:1px solid rgba(var(--ac),0.30);
    border-radius:14px;
    padding:24px 32px;
    min-width:320px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .kbd-help-title{
    font-family:var(--mono); font-size:9px; letter-spacing:0.4em;
    color:rgba(var(--ac),0.9); margin-bottom:16px; text-align:center;
  }
  .kbd-row{
    display:flex; align-items:center; gap:10px;
    font-family:var(--mono); font-size:11px;
    color:var(--text); margin-bottom:8px;
  }
  .kbd-row span{ flex:1; color:var(--dim); font-size:10px; }
  kbd{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:24px; height:22px; padding:0 6px;
    background:rgba(var(--ac),0.12);
    border:1px solid rgba(var(--ac),0.30);
    border-radius:5px;
    font-family:var(--mono); font-size:10px;
    color:rgba(var(--ac2),0.95);
  }

  /* ── ドラッグ&ドロップ視覚フィードバック強化 ── */
  body.dragging::after{
    content:''; position:fixed; inset:8px; z-index:99;
    border:2px dashed rgba(var(--ac),0.5);
    border-radius:14px; pointer-events:none;
    background:rgba(var(--ac),0.04);
  }
}

/* PC専用ツールバーはスマホでは非表示 */
.pc-tools{ display:none; }
.kbd-help{ display:none; }

/* ── マウス環境のみhoverフィードバック(タッチ端末のsticky hover回避) ── */
@media (hover:hover) and (pointer:fine){
  .btn:hover:not(:disabled){
    background:rgba(var(--ac),0.10);
    border-color:rgba(var(--ac),0.34);
    color:#fff;
  }
  .play-btn:hover{
    background:linear-gradient(165deg,rgba(var(--ac),0.22),rgba(var(--ac),0.08));
    box-shadow:0 0 26px rgba(var(--ac),0.28), inset 0 1px 0 rgba(255,255,255,0.14);
  }
  .pl-btn:hover{ color:var(--text); border-color:rgba(var(--ac),0.32); }
  .pl-item:hover{ background:rgba(var(--ac),0.05); }
  .file-label:hover{ background:rgba(var(--ac),0.16); border-color:rgba(var(--ac),0.65); }
  input[type=range]::-webkit-slider-thumb:hover{ box-shadow:0 0 12px rgba(var(--ac),0.9); }
}

/* ── ガラス板の共通レシピ ── */
.viz-wrap,.scroll-wf-card,.meter-card,.panel-canvas-wrap,
.seek-canvas-wrap,.playlist-list{
  background:linear-gradient(165deg, rgba(255,255,255,0.045) 0%, rgba(255,255,255,0.012) 60%, rgba(var(--ac),0.025) 100%);
  border:1px solid rgba(var(--ac),0.13);
  border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 28px rgba(0,0,0,0.35);
  backdrop-filter:blur(12px) saturate(135%);
  -webkit-backdrop-filter:blur(12px) saturate(135%);
}

/* ── Header ── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 8px;
  flex-shrink:0;
  position:relative;
}
/* デュアリティ・ホライズン：光の線の上に、紛争の線がconfで重なる */
.header::after{
  content:'';position:absolute;bottom:0;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--ac),0.7) 35%,rgba(var(--ac2),0.5) 65%,transparent);
  box-shadow:0 0 12px rgba(var(--ac),0.5);
}
.header::before{
  content:'';position:absolute;bottom:0;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--hot),0.9) 70%,transparent);
  box-shadow:0 0 14px rgba(var(--hot),0.6);
  opacity:var(--conf);
  transition:opacity 0.6s linear;
}
.logo{
  font-family:var(--font);font-weight:700;font-size:20px;
  letter-spacing:0.24em;
  background:linear-gradient(100deg,#fff 25%,rgba(var(--ac),1) 70%,rgba(var(--ac2),1) 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(var(--ac),0.45));
}
.logo em{font-style:normal;}
.header-right{
  font-family:var(--mono);font-size:8px;
  color:var(--dim);letter-spacing:0.25em;text-align:right;line-height:1.6;
}
.header-right .live{color:rgba(var(--ac),0.9);animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}

/* ── Top section: Imager + Meters ── */
.top-section{
  display:flex;gap:6px;
  flex-shrink:0;
  position:relative;
  align-items:stretch;
  padding:0 12px;
  overflow:hidden;
}
.viz-wrap{
  flex:1;
  position:relative;overflow:hidden;
  cursor:pointer;
}
.viz-wrap canvas{display:block;width:100%;height:100%;}
.viz-wrap::before{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  border-radius:var(--r);
  background:linear-gradient(150deg,rgba(255,255,255,0.05) 0%,transparent 35%);
}

.right-panel{
  display:flex;flex-direction:column;
  width:96px;flex-shrink:0;
  gap:6px;
}
.scroll-wf-card{
  width:44px;flex-shrink:0;
  overflow:hidden;
  display:flex;flex-direction:column;
}
.scroll-wf-card .meter-label{padding:4px 5px 2px;font-size:6px;}
.scroll-wf-card canvas{flex:1;display:block;width:100%;}
.meter-card{
  flex:1;
  padding:7px 9px;
  position:relative;
  overflow:hidden;
}
.meter-card-inner{display:flex;align-items:stretch;gap:6px;height:100%;}
.meter-card-inner > div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;}
.bar-canvas{
  width:18px;flex-shrink:0;display:block;
  border-left:1px solid rgba(var(--ac),0.10);
}
.meter-label{
  font-family:var(--font);font-weight:600;
  font-size:7px;letter-spacing:0.35em;
  color:var(--dim);text-transform:uppercase;margin-bottom:3px;
}
.meter-val{
  font-family:var(--mono);font-size:19px;
  color:#fff;line-height:1;
  white-space:nowrap;overflow:hidden;
  text-shadow:0 0 14px rgba(var(--ac),0.55);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}
/* 数字本体だけ固定幅化。"-70.0" の5文字+少し余裕を確保 */
.meter-val .num{
  display:inline-block;
  width:5ch;
  text-align:right;
  overflow:visible;
}
.meter-unit{font-size:8px;color:rgba(var(--ac),0.9);margin-left:1px;vertical-align:super;}
.meter-sub{
  font-family:var(--mono);font-size:7px;color:var(--dim);
  letter-spacing:0.08em;margin-top:3px;
  white-space:nowrap;overflow:hidden;height:10px;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}
.meter-sub .num{
  display:inline-block;
  width:5ch;
  text-align:right;
  overflow:visible;
}
.lufs-bar-wrap{margin-top:3px;height:2px;background:rgba(var(--ac),0.10);border-radius:1px;overflow:hidden;}
.lufs-bar-fill{
  height:100%;width:100%;border-radius:1px;
  transform:scaleX(0);transform-origin:left center;
  will-change:transform;
}

/* ── Spectrum ── */
.eq-section{flex-shrink:0;margin:8px 12px 0;}
.panel-label{
  font-family:var(--font);font-weight:300;font-style:italic;
  font-size:8px;letter-spacing:0.4em;color:var(--dim);
  text-transform:uppercase;margin-bottom:4px;padding-left:4px;
}
.panel-canvas-wrap{position:relative;overflow:hidden;}
#eqCanvas{width:100%;height:68px;display:block;position:relative;z-index:0;}

/* ── Seekbar waveform ── */
.seek-section{flex-shrink:0;margin:8px 12px 0;}
.seek-canvas-wrap{
  position:relative;
  overflow:hidden;
  height:52px;
  cursor:pointer;
}
#seekWfCanvas{display:block;width:100%;height:100%;position:absolute;top:0;left:0;}
.seek-fill-line{
  position:absolute;top:0;bottom:0;left:0;width:0%;
  background:rgba(var(--ac),0.08);z-index:2;pointer-events:none;
  border-right:1px solid rgba(var(--ac),0.65);
  box-shadow:2px 0 14px rgba(var(--ac),0.35);
}
.seek-thumb-line{
  position:absolute;top:0;bottom:0;left:0%;
  width:2px;background:rgba(var(--ac),1);z-index:3;pointer-events:none;
  box-shadow:0 0 8px rgba(var(--ac),0.8);
  transform:translateX(-50%);
  display:none;
}
.seek-canvas-wrap:hover .seek-thumb-line,
.seek-canvas-wrap.dragging .seek-thumb-line{display:block;}
.seek-times-row{
  display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:9px;color:var(--dim);
  margin-top:4px;padding:0 4px;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}

/* ── Playlist ── */
.playlist-section{
  flex-shrink:0;margin:8px 12px 0;
  flex:1;min-height:0;
  display:flex;flex-direction:column;
}
.playlist-header{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.pl-count-badge{
  font-family:var(--mono);font-size:8px;color:rgba(var(--ac),0.95);
  background:rgba(var(--ac),0.07);
  border:1px solid rgba(var(--ac),0.18);
  border-radius:999px;
  padding:3px 9px;
  margin-right:auto;
}
.pl-btn{
  background:linear-gradient(165deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015));
  border:1px solid rgba(var(--ac),0.13);
  border-radius:9px;
  color:var(--dim);
  font-family:var(--mono);font-size:8px;letter-spacing:0.15em;
  padding:5px 9px;cursor:pointer;text-transform:uppercase;
  transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.pl-btn:active{background:rgba(var(--ac),0.12);border-color:rgba(var(--ac),0.35);color:#fff;}
.pl-btn.active{background:rgba(var(--ac),0.10);border-color:rgba(var(--ac),0.55);color:rgba(var(--ac),1);}

.playlist-list{
  flex:1;
  overflow-y:auto;
  min-height:40px;
}
.playlist-list::-webkit-scrollbar{width:2px;}
.playlist-list::-webkit-scrollbar-thumb{background:rgba(var(--ac),0.25);}
.pl-empty{padding:14px;text-align:center;font-family:var(--mono);font-size:8px;color:var(--dim);letter-spacing:0.25em;}
.pl-item{
  display:flex;align-items:center;gap:6px;padding:6px 12px;
  border-bottom:1px solid rgba(var(--ac),0.05);
  cursor:pointer;transition:background 0.1s;user-select:none;
}
.pl-item:last-child{border-bottom:none;}
.pl-item:active{background:rgba(var(--ac),0.06);}
.pl-item.active{
  background:linear-gradient(90deg,rgba(var(--ac),0.10),rgba(var(--ac),0.02));
  border-left:2px solid rgba(var(--ac),1);
}
.pl-item.active .pl-title{color:#fff;}
.pl-num{font-family:var(--mono);font-size:8px;color:var(--dim);min-width:16px;text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.pl-item.active .pl-num{color:rgba(var(--ac),1);}
.pl-title{font-family:var(--font);font-weight:300;font-size:11px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl-dur{font-family:var(--mono);font-size:8px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.pl-del{font-size:10px;color:var(--dim);padding:0 2px;opacity:0;transition:opacity 0.1s;cursor:pointer;}
.pl-item:hover .pl-del{opacity:0.6;}
.pl-icon{font-size:7px;color:rgba(var(--ac),0.9);min-width:10px;}
/* 再生中トラックの動くEQバー(transformのみ=GPU負荷最小) */
.pl-playing-icon{min-width:12px;display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(var(--ac),1);}
.pl-eq{display:inline-flex;align-items:flex-end;gap:1.5px;height:10px;}
.pl-eq i{
  width:2px;border-radius:1px;
  background:rgba(var(--ac),1);
  box-shadow:0 0 4px rgba(var(--ac),0.55);
  transform-origin:bottom;
  animation:pl-eq-b 0.9s ease-in-out infinite;
}
.pl-eq i:nth-child(1){height:7px;animation-delay:0s;}
.pl-eq i:nth-child(2){height:10px;animation-delay:0.22s;}
.pl-eq i:nth-child(3){height:6px;animation-delay:0.46s;}
@keyframes pl-eq-b{0%,100%{transform:scaleY(0.3);}50%{transform:scaleY(1);}}
@media (prefers-reduced-motion:reduce){
  .pl-eq i{animation:none;transform:scaleY(0.7);}
}

/* ── Player ── */
.player{
  flex-shrink:0;
  padding:9px 12px;
  padding-bottom:max(9px,env(safe-area-inset-bottom));
  position:relative;
}
.player::before{
  content:'';position:absolute;top:0;left:12px;right:12px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--ac),0.30),transparent);
}
.now-playing{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;overflow:hidden;}
.now-playing-label{
  font-family:var(--font);font-weight:200;font-style:italic;
  font-size:8px;letter-spacing:0.35em;color:var(--dim);
  text-transform:uppercase;white-space:nowrap;flex-shrink:0;
}
.track-name{
  font-family:var(--font);font-weight:600;font-size:14px;
  color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  text-shadow:0 0 20px rgba(var(--ac),0.55);
}
/* 長い曲名:収まらん時だけ往復オートスクロール */
.track-name.marquee{text-overflow:clip;}
.track-name-inner{display:inline-block;will-change:transform;}
.track-name.marquee .track-name-inner{
  animation:tn-scroll var(--tn-dur,10s) ease-in-out infinite;
}
@keyframes tn-scroll{
  0%,15%{transform:translateX(0);}
  85%,100%{transform:translateX(calc(-1 * var(--tn-shift,0px)));}
}

/* Controls */
.controls-wrap{display:flex;flex-direction:column;gap:7px;}
.controls-row{display:flex;align-items:center;gap:5px;}

.btn{
  background:linear-gradient(165deg,rgba(255,255,255,0.055),rgba(255,255,255,0.015));
  border:1px solid rgba(var(--ac),0.14);
  border-radius:12px;
  color:var(--text);
  font-family:var(--mono);font-size:10px;letter-spacing:0.1em;
  padding:0;cursor:pointer;text-transform:uppercase;
  transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
  height:42px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.07);
}
.btn::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--ac2),0.25),transparent);
}
.btn:active{
  background:rgba(var(--ac),0.13);
  border-color:rgba(var(--ac),0.4);
  color:#fff;
}
.btn:disabled{opacity:0.2;cursor:default;}
.btn.active{background:rgba(var(--ac),0.10);border-color:rgba(var(--ac),0.55);color:rgba(var(--ac),1);}

.play-btn{
  font-size:20px;width:54px;
  border-radius:21px;
  background:linear-gradient(165deg,rgba(var(--ac),0.16),rgba(var(--ac),0.05));
  border-color:rgba(var(--ac),0.4);
  color:#fff;
  box-shadow:0 0 20px rgba(var(--ac),0.18), inset 0 1px 0 rgba(255,255,255,0.12);
}
.play-btn:active{background:rgba(var(--ac),0.24);}

.nav-btn{font-size:16px;width:40px;}
.skip-btn{font-size:10px;width:44px;letter-spacing:0.05em;}
.load-btn{font-size:9px;padding:0 12px;letter-spacing:0.2em;flex:1;}
.vol-wrap{
  display:flex;align-items:center;gap:6px;flex:2;
  font-family:var(--mono);font-size:7px;letter-spacing:0.2em;color:var(--dim);
}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:2px;
  background:rgba(var(--ac),0.16);outline:none;border-radius:1px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:rgba(var(--ac),1);
  box-shadow:0 0 8px rgba(var(--ac),0.6);cursor:pointer;
}

/* ── Drop overlay ── */
.drop-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(4,3,16,0.55);
  backdrop-filter:blur(28px) saturate(130%);
  -webkit-backdrop-filter:blur(28px) saturate(130%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
}
.drop-overlay.hidden{display:none;}
.drop-logo{
  font-family:var(--font);font-weight:700;font-size:36px;
  letter-spacing:0.28em;
  background:linear-gradient(100deg,#fff 25%,rgba(var(--ac),1) 70%,rgba(var(--ac2),1) 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 24px rgba(var(--ac),0.5));
}
.drop-logo em{font-style:normal;}
.file-label{
  border:1px solid rgba(var(--ac),0.35);color:#fff;
  border-radius:999px;
  font-family:var(--font);font-weight:600;font-size:14px;letter-spacing:0.3em;
  padding:16px 48px;cursor:pointer;text-transform:uppercase;display:inline-block;
  transition:all 0.15s;
  background:linear-gradient(165deg,rgba(var(--ac),0.10),rgba(var(--ac),0.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.1), 0 0 28px rgba(var(--ac),0.12);
}
.file-label:active{background:rgba(var(--ac),0.18);border-color:rgba(var(--ac),0.7);}
.drop-sub2{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:0.2em;}

/* ── A11y / motion ── */
:focus-visible{outline:1.5px solid rgba(var(--ac),0.8);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  .header-right .live{animation:none;}
  body::before,body::after,.header::before{transition:none;}
  .track-name.marquee .track-name-inner{animation:none;}
}
</style>
</head>
<body>

<!-- Drop overlay -->
<div class="drop-overlay" id="dropOverlay">
  <div class="drop-logo">AU<em>R</em>A</div>
  <label class="file-label" for="fileInput">ファイルを選択</label>
  <input type="file" id="fileInput" accept=".mp3,.wav,.aac,.flac,.ogg,.m4a,.aiff,.opus,audio/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
  <div class="drop-sub2">MP3 · WAV · FLAC · M4A · 複数可</div>
</div>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="logo">AU<em>R</em>A</div>
    <div class="header-right">
      <div class="pc-tools" id="pcTools">
        <button class="pc-btn" id="fsBtn" title="フルスクリーン (F)" aria-label="Fullscreen">⛶</button>
        <button class="pc-btn" id="miniBtn" title="ミニモード:キューブのみ (M)" aria-label="Mini mode">◫</button>
        <button class="pc-btn" id="ssBtn" title="スクリーンショット (S)" aria-label="Screenshot">⊕</button>
        <button class="pc-btn" id="helpBtn" title="キーボードショートカット (?)" aria-label="Help">?</button>
      </div>
      <div class="live" id="headerStatus">● ANALYZER</div>
      <div>STEREO IMAGER · B23</div>
    </div>
  </div>

  <!-- Keyboard shortcut help (PC only) -->
  <div class="kbd-help" id="kbdHelp" hidden>
    <div class="kbd-help-inner">
      <div class="kbd-help-title">KEYBOARD</div>
      <div class="kbd-row"><kbd>Space</kbd><span>再生 / 一時停止</span></div>
      <div class="kbd-row"><kbd>←</kbd><kbd>→</kbd><span>5秒シーク</span></div>
      <div class="kbd-row"><kbd>↑</kbd><kbd>↓</kbd><span>音量 ±5%</span></div>
      <div class="kbd-row"><kbd>N</kbd><kbd>P</kbd><span>次の曲 / 前の曲</span></div>
      <div class="kbd-row"><kbd>F</kbd><span>フルスクリーン</span></div>
      <div class="kbd-row"><kbd>M</kbd><span>ミニモード</span></div>
      <div class="kbd-row"><kbd>S</kbd><span>スクリーンショット</span></div>
      <div class="kbd-row"><kbd>V</kbd><span>ビジュアライザ切替</span></div>
      <div class="kbd-row"><kbd>?</kbd><kbd>Esc</kbd><span>このヘルプを閉じる</span></div>
    </div>
  </div>

  <!-- Imager | Live WF | Meters -->
  <div class="top-section">
    <div class="viz-wrap">
      <canvas id="imagerCanvas"></canvas>
    </div>
    <div class="scroll-wf-card">
      <div class="meter-label">Live</div>
      <canvas id="wfCanvas"></canvas>
    </div>
    <div class="right-panel">
      <div class="meter-card">
        <div class="meter-card-inner">
          <div>
            <div class="meter-label">LUFS-M</div>
            <div class="meter-val" id="lufsVal"><span class="num">—</span><span class="meter-unit">LU</span></div>
            <div class="lufs-bar-wrap"><div class="lufs-bar-fill" id="lufsBar"></div></div>
            <div class="meter-sub" id="lufsIntVal">AVG <span class="num">—</span></div>
          </div>
          <canvas class="bar-canvas" id="lufsBarCanvas"></canvas>
        </div>
      </div>
      <div class="meter-card">
        <div class="meter-card-inner">
          <div>
            <div class="meter-label">Peak</div>
            <div class="meter-val" id="peakVal"><span class="num">—</span><span class="meter-unit">dB</span></div>
            <div class="meter-sub" id="peakHoldVal">MAX <span class="num">—</span></div>
          </div>
          <canvas class="bar-canvas" id="peakBarCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Spectrum -->
  <div class="eq-section">
    <div class="panel-label">Spectrum</div>
    <div class="panel-canvas-wrap">
      <canvas id="eqCanvas" height="68"></canvas>
    </div>
  </div>

  <!-- Seek + Waveform (combined) -->
  <div class="seek-section">
    <div class="panel-label">Waveform</div>
    <div class="seek-canvas-wrap" id="seekWrap">
      <canvas id="seekWfCanvas"></canvas>
      <div class="seek-fill-line" id="seekFill"></div>
      <div class="seek-thumb-line" id="seekThumb"></div>
    </div>
    <div class="seek-times-row">
      <span id="curTime">0:00</span>
      <span id="durTime">0:00</span>
    </div>
  </div>

  <!-- Playlist -->
  <div class="playlist-section">
    <div class="playlist-header">
      <div class="pl-count-badge">PLAYLIST · <span id="plCount">0</span></div>
      <div style="display:flex;gap:4px;">
        <button class="pl-btn" id="shuffleBtn">⇄ SHUF</button>
        <button class="pl-btn" id="repeatBtn">↺ REP</button>
        <label class="pl-btn" for="fileInput2">＋ ADD</label>
        <input type="file" id="fileInput2" accept=".mp3,.wav,.aac,.flac,.ogg,.m4a,.aiff,.opus,audio/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
        <button class="pl-btn" id="clearBtn">✕</button>
      </div>
    </div>
    <div class="playlist-list" id="playlistList">
      <div class="pl-empty" id="plEmpty">— ADD でファイルを追加 —</div>
    </div>
  </div>

  <!-- Player -->
  <div class="player">
    <div class="now-playing" style="margin-bottom:4px;">
      <span class="now-playing-label">Now Playing</span>
      <span class="track-name" id="trackName">—</span>
    </div>
    <div class="controls-wrap">
      <div class="controls-row">
        <button class="btn nav-btn" id="prevBtn" disabled>⏮</button>
        <button class="btn skip-btn" id="skipBackBtn" disabled>«5s</button>
        <button class="btn play-btn" id="playBtn" disabled>▶</button>
        <button class="btn skip-btn" id="skipFwdBtn" disabled>5s»</button>
        <button class="btn nav-btn" id="nextBtn" disabled>⏭</button>
      </div>
      <div class="controls-row">
        <label class="btn load-btn" for="fileInput3">⊕ LOAD</label>
        <input type="file" id="fileInput3" accept=".mp3,.wav,.aac,.flac,.ogg,.m4a,.aiff,.opus,audio/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
        <div class="vol-wrap">
          <span>VOL</span>
          <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </div>
  </div>

</div>

<script>

// ── Canvases ──
const imagerCanvas = document.getElementById('imagerCanvas');
const ic = imagerCanvas.getContext('2d');
const eqCanvas = document.getElementById('eqCanvas');
const ec = eqCanvas.getContext('2d');
const seekWfCanvas = document.getElementById('seekWfCanvas');
const swc = seekWfCanvas ? seekWfCanvas.getContext('2d') : null;
const wfCanvas = document.getElementById('wfCanvas');
const wc = wfCanvas ? wfCanvas.getContext('2d') : null;

// ── HiDPI(Retina)対応 ──
// スマホは1CSSピクセル=2〜3実ピクセル。canvasの内部解像度を上げんとぼやける。
// 3倍はフルやと描画負荷が9倍になるので2でキャップ。
const DPR = Math.min(window.devicePixelRatio || 1, 2);
function cw(c){ return c.width / DPR; }   // 論理(CSS)幅
function ch(c){ return c.height / DPR; }  // 論理(CSS)高さ
function setHiDPI(c, ctx, w, h){
  if (!c || !ctx) return;
  c.width = Math.round(w * DPR);
  c.height = Math.round(h * DPR);
  // 以降の描画コードはCSSピクセル座標のままでOKにする
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// ── UI refs ──
const dropOverlay = document.getElementById('dropOverlay');
const dropBox = null; // element removed; kept as null to avoid reference errors
const fileInput = document.getElementById('fileInput');
const fileInput2 = document.getElementById('fileInput2');
const fileInput3 = document.getElementById('fileInput3');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const skipBackBtn = document.getElementById('skipBackBtn');
const skipFwdBtn = document.getElementById('skipFwdBtn');
const volSlider = document.getElementById('volSlider');
const trackName = document.getElementById('trackName');
const dbVal = null; // element removed
const freqVal = null; // element removed
const lufsVal = document.getElementById('lufsVal');
const lufsBar = document.getElementById('lufsBar');
const lufsIntVal = document.getElementById('lufsIntVal');
const peakVal = document.getElementById('peakVal');
const peakHoldVal = document.getElementById('peakHoldVal');
// 数字部分のspanだけ参照を持つ(毎フレームinnerHTML再生成を避けて軽量化)
const lufsValNum    = lufsVal     && lufsVal.querySelector('.num');
const lufsIntValNum = lufsIntVal  && lufsIntVal.querySelector('.num');
const peakValNum    = peakVal     && peakVal.querySelector('.num');
const peakHoldValNum= peakHoldVal && peakHoldVal.querySelector('.num');
const seekWrap = document.getElementById('seekWrap');
const seekFill = document.getElementById('seekFill');
const seekBuffer = null; // removed
const lufsBarCanvas = document.getElementById('lufsBarCanvas');
const lbc = lufsBarCanvas ? lufsBarCanvas.getContext('2d') : null;
const peakBarCanvas = document.getElementById('peakBarCanvas');
const pbc = peakBarCanvas ? peakBarCanvas.getContext('2d') : null;
const seekThumb = document.getElementById('seekThumb');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const clearBtn = document.getElementById('clearBtn');
const playlistList = document.getElementById('playlistList');
const plEmpty = document.getElementById('plEmpty');
const plCount = document.getElementById('plCount');

// ── Audio state ──
let audioCtx, analyser, analyserL, analyserR, splitter, gainNode, compressor;
let dataArray, freqArray, bufferLength;
let sourceNode = null;
let startTime = 0, pauseOffset = 0, isPlaying = false;
// startPlaybackFromOffset の競合対策:非同期 resume 待ち中に再呼び出しされた場合、
// 古い doStart は myGen !== startGen で弾く(二重再生防止)
let startGen = 0;

// LUFS state
let lufsHistory = [];
let peakDbHold = -Infinity, peakDbTimer = 0;

// draw ループ用 Float32Array(GC削減のため再利用)
let _drawBufL = null, _drawBufR = null;
let _imgBufL = null, _imgBufR = null;

// Waveform scrolling buffer — larger = slower scroll
const WF_BUF = 4000;
let wfBuffer = new Float32Array(WF_BUF);
let wfWrite = 0;

// ── Playlist state ──
let playlist = []; // [{name, buffer, duration}]
let currentIndex = -1;
let shuffleMode = false;
let repeatMode = 'none'; // 'none' | 'all' | 'one'
let shuffleOrder = [];

// ── Resize ──
// PC判定:CSSの@mediaと完全に同じ条件を使う
const _wideMQ = (typeof matchMedia !== 'undefined')
  ? matchMedia('(pointer: fine) and (min-width: 1100px) and (min-height: 780px)')
  : null;
function isWideLayout(){
  return _wideMQ ? _wideMQ.matches : false;
}

function resizeAll() {
  const wide = isWideLayout();
  const vizWrapEl = document.querySelector('.viz-wrap');
  const rpEl = document.querySelector('.right-panel');
  const wfEl2 = document.querySelector('.scroll-wf-card');

  if (wide) {
    // PC: レイアウトはCSSが決める。canvasの内部解像度だけ要素の実寸に追従させる
    if (vizWrapEl) {
      // 過去にスマホレイアウトで設定されたインラインstyleを削除(CSSに譲る)
      vizWrapEl.style.width = ''; vizWrapEl.style.height = ''; vizWrapEl.style.flex = '';
    }
    if (wfEl2) wfEl2.style.height = '';
    if (rpEl)  rpEl.style.height  = '';
    const vr = vizWrapEl ? vizWrapEl.getBoundingClientRect() : null;
    const vsz = vr ? Math.max(10, Math.round(Math.min(vr.width, vr.height))) : 320;
    setHiDPI(imagerCanvas, ic, vsz, vsz);
  } else {
    // スマホ: 既存の「画面に合わせて正方形を計算」ロジック
    const topSection = document.querySelector('.top-section');
    const rpW = rpEl ? rpEl.offsetWidth : 96;
    const wfW = wfEl2 ? wfEl2.offsetWidth : 44;
    const totalW = (topSection ? topSection.offsetWidth : window.innerWidth) - 24;
    const sz = Math.max(10, totalW - rpW - wfW - 12);  // gap 6px ×2
    if (vizWrapEl) {
      vizWrapEl.style.width = sz + 'px';
      vizWrapEl.style.height = sz + 'px';
      vizWrapEl.style.flex = 'none';
    }
    setHiDPI(imagerCanvas, ic, sz, sz);
    if (wfEl2) wfEl2.style.height = sz + 'px';
    if (rpEl)  rpEl.style.height  = sz + 'px';
  }

  // 共通:横長キャンバス類のDPR追従
  const wfEl = document.getElementById('wfCanvas');
  if (wfEl && wc) setHiDPI(wfEl, wc, wfEl.offsetWidth || 84, wfEl.offsetHeight || 40);
  setHiDPI(eqCanvas, ec, eqCanvas.offsetWidth || window.innerWidth, eqCanvas.offsetHeight || 68);
  const sw = seekWfCanvas;
  if (sw && swc) setHiDPI(sw, swc, sw.offsetWidth || window.innerWidth - 24, sw.offsetHeight || 52);
  drawFullWaveform();
}
window.addEventListener('resize', resizeAll);
setTimeout(resizeAll, 100);
// PC↔スマホレイアウト切り替え時(ウィンドウサイズ変更等)に即座に再計算
if (_wideMQ) {
  try { _wideMQ.addEventListener('change', resizeAll); }
  catch(_){ try { _wideMQ.addListener(resizeAll); } catch(__){} }
}
// PC時にCSSがviz-wrapのサイズを変えた瞬間にcanvasのDPR解像度も追従させる
if (typeof ResizeObserver !== 'undefined') {
  try {
    const vw = document.querySelector('.viz-wrap');
    if (vw) new ResizeObserver(() => { if (isWideLayout()) resizeAll(); }).observe(vw);
  } catch(_){}
}

// ── Audio context ──
function initAudioCtx() {
  // 生きているコンテキストがあれば何もしない。
  // 'closed'(バックグラウンドキル・bfcache復帰等でOSに破棄された)場合は作り直す。
  if (audioCtx && audioCtx.state !== 'closed') return;
  if (audioCtx) {
    // 古い(closed済み)グラフの後始末。closed済みなのでstop等は不要、参照を切るだけ
    try { if (sourceNode) { sourceNode.onended = null; sourceNode.disconnect(); } } catch(_){}
    sourceNode = null;
    audioCtx = null;
    if (isPlaying) {
      isPlaying = false;
      if (playBtn) playBtn.textContent = '▶';
      msSetState('paused');
    }
  }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {
    console.error('[AURA] AudioContext create failed:', e);
    return;
  }
  // iOS unlock: 短い無音バッファを user gesture 内で再生
  // sample rate はブラウザの sampleRate を直接使う(22050固定だとSafariで弾かれる事がある)
  try {
    const sr = audioCtx.sampleRate || 44100;
    const silentBuf = audioCtx.createBuffer(1, 1, sr);
    const silentSrc = audioCtx.createBufferSource();
    silentSrc.buffer = silentBuf;
    silentSrc.connect(audioCtx.destination);
    silentSrc.start(0);
  } catch(e) {
    console.warn('[AURA] silent unlock skipped:', e);
  }
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 4096;
  analyser.smoothingTimeConstant = 0.75;
  // Stereo splitter for imager
  splitter = audioCtx.createChannelSplitter(2);
  analyserL = audioCtx.createAnalyser();
  analyserR = audioCtx.createAnalyser();
  analyserL.fftSize = 4096;
  analyserR.fftSize = 4096;
  analyserL.smoothingTimeConstant = 0.0;
  analyserR.smoothingTimeConstant = 0.0;
  gainNode = audioCtx.createGain();
  // localStorage に変な値が保存されていた場合の保険(NaN, 0, undefined)
  let initVol = parseFloat(volSlider.value);
  if (!isFinite(initVol) || initVol <= 0) initVol = 0.8;
  if (initVol > 1) initVol = 1;
  volSlider.value = initVol;
  gainNode.gain.value = initVol;
  // Soft limiter:極端な圧縮にせず、純粋にクリッピング保護に徹する
  compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -3;   // -1 → -3 (もうちょい余裕)
  compressor.knee.value = 6;         // 0 → 6 (ハードノブ→ソフトに)
  compressor.ratio.value = 8;        // 20 → 8 (押さえつけ過ぎ防止)
  compressor.attack.value = 0.003;
  compressor.release.value = 0.25;
  // Graph: source -> analyser(main) -> gainNode -> compressor -> destination
  //                                             -> splitter -> analyserL/R
  analyser.connect(gainNode);
  gainNode.connect(compressor);
  compressor.connect(audioCtx.destination);
  gainNode.connect(splitter);
  splitter.connect(analyserL, 0);
  splitter.connect(analyserR, 1);
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
  freqArray = new Uint8Array(bufferLength);
}
volSlider.addEventListener('input', () => {
  if (!gainNode) return;
  gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
  gainNode.gain.setValueAtTime(parseFloat(volSlider.value), audioCtx.currentTime);
});

// ── AudioContext状態ヘルパー ──
// iOS Safariは 'suspended' の他に独自の 'interrupted' 状態がある
// (電話・Siri・アプリ切替・画面ロック等)。=== 'suspended' だけ見ていると
// 復帰時に resume() されず「再生ボタンを押しても無音」になる。
function ctxNeedsResume() {
  return !!audioCtx && audioCtx.state !== 'running' && audioCtx.state !== 'closed';
}

// 現在の再生位置を安全に計算(suspend/close中はcurrentTimeが凍結しているので
// 「止まった時点の位置」がそのまま取れる)
function computeElapsedOffset() {
  const t = playlist[currentIndex];
  if (!t || !audioCtx) return 0;
  const elapsed = audioCtx.currentTime - startTime;
  return Math.max(0, Math.min(elapsed, t.duration - 0.1));
}

// 再生状態を「指定位置で一時停止」に強制変換(復旧不能時のフォールバック)
function forcePausedAt(offset) {
  pauseOffset = offset;
  isPlaying = false;
  playBtn.textContent = '▶';
  msSetState('paused');
  const src = sourceNode;
  sourceNode = null;
  if (src) {
    src.onended = null;
    try { src.stop(0); } catch(_){}
    try { src.disconnect(); } catch(_){}
  }
  if (playlist[currentIndex]) updateSeek(offset / playlist[currentIndex].duration);
  renderPlaylist();
}

// Auto-resume AudioContext on iOS when returning to foreground
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !audioCtx) return;
  if (audioCtx.state === 'closed') {
    // OSにコンテキストごと破棄された。ここはuser gesture外なので
    // 自動再開はできない → 位置を保存して一時停止状態にしておく
    // (次のタップで resumeOnInteraction / playボタンが復旧させる)
    if (isPlaying) forcePausedAt(computeElapsedOffset());
    return;
  }
  if (ctxNeedsResume()) {
    audioCtx.resume().then(() => {
      // If was playing before suspend, restart playback
      if (isPlaying && playlist[currentIndex]) {
        pauseOffset = computeElapsedOffset();
        startPlaybackFromOffset(pauseOffset);
      }
    }).catch(err => console.warn('[AURA] visibility resume failed:', err));
  }
});

// iOS Safari: also resume on any touch/click after returning
function resumeOnInteraction() {
  if (!audioCtx) return;
  if (audioCtx.state === 'closed') {
    // user gesture内なのでコンテキストを作り直して完全復旧できる
    const wasPlaying = isPlaying;
    const off = computeElapsedOffset(); // ※古いctxから位置を取ってから作り直す
    initAudioCtx();
    if (!audioCtx) return;
    pauseOffset = off;
    if (wasPlaying && playlist[currentIndex]) {
      startPlaybackFromOffset(off);
    } else if (playlist[currentIndex]) {
      updateSeek(off / playlist[currentIndex].duration);
    }
    return;
  }
  if (ctxNeedsResume()) {
    audioCtx.resume().then(() => {
      if (isPlaying && playlist[currentIndex]) {
        pauseOffset = computeElapsedOffset();
        startPlaybackFromOffset(pauseOffset);
      }
    }).catch(err => console.warn('[AURA] interaction resume failed:', err));
  }
}
document.addEventListener('touchstart', resumeOnInteraction, { passive: true });
document.addEventListener('click', resumeOnInteraction);

// bfcache(戻る/進むキャッシュ)からの復帰対策:
// タブやアプリを閉じて再度開くと、JSの状態はそのまま復元されるが
// AudioContextは死んでいる(closed / 永久にresumeしないsuspended)ことがある。
// isPlaying=true のまま残ると「再生中表示なのに無音」になるので、
// 一時停止状態に落としておき、次の再生操作時に initAudioCtx が作り直す。
window.addEventListener('pageshow', (e) => {
  if (!e.persisted || !audioCtx) return;
  if (isPlaying) forcePausedAt(computeElapsedOffset());
});

// ── File loading ──
function isAudioFile(file) {
  return file.type.startsWith('audio/') || /\.(mp3|wav|aac|flac|ogg|m4a|aiff|opus)$/i.test(file.name);
}

function loadFiles(files) {
  if (!files || files.length === 0) return;
  // iOS requires AudioContext to be created inside a user gesture
  initAudioCtx();
  if (!audioCtx) { alert('AudioContextの初期化に失敗しました'); return; }
  // resume は async だが、ここでは fire-and-forget で OK
  // (decode 中に running になる) ただし catch して握りつぶさない
  if (ctxNeedsResume()) {
    const p = audioCtx.resume();
    if (p && p.catch) p.catch(err => console.error('[AURA] resume failed:', err));
  }

  const audioFiles = Array.from(files).filter(isAudioFile);
  if (audioFiles.length === 0) {
    alert('対応しているオーディオファイルが見つかりませんでした');
    return;
  }
  dropOverlay.classList.add('hidden');

  let loaded = 0;
  let succeeded = 0;
  const total = audioFiles.length;

  audioFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      // iOS Safari needs a copied buffer (slice) for decodeAudioData
      const arraybuf = e.target.result.slice(0);
      const promise = audioCtx.decodeAudioData(arraybuf, buf => {
        const name = file.name.replace(/\.[^.]+$/, '');
        playlist.push({ name, buffer: buf, duration: buf.duration });
        loaded++;
        succeeded++;
        renderPlaylist();
        if (loaded === total && currentIndex === -1 && playlist.length > 0) {
          playTrack(0);
        }
      }, err => {
        console.error('[AURA] decodeAudioData error:', file.name, err);
        loaded++;
        if (loaded === total && currentIndex === -1 && playlist.length > 0) {
          playTrack(0);
        }
      });
      // Modern promise-based fallback
      if (promise && promise.catch) {
        promise.catch(err => console.error('[AURA] decodeAudioData promise error:', file.name, err));
      }
    };
    reader.onerror = e => {
      console.error('[AURA] FileReader error:', file.name, e);
      loaded++;
    };
    reader.readAsArrayBuffer(file);
  });
}

fileInput.addEventListener('change', e => { loadFiles(e.target.files); e.target.value=''; });
fileInput2.addEventListener('change', e => { loadFiles(e.target.files); e.target.value=''; });
fileInput3.addEventListener('change', e => { loadFiles(e.target.files); e.target.value=''; });

// ── Playlist UI ──
function renderPlaylist() {
  plCount.textContent = playlist.length;
  if (playlist.length === 0) {
    plEmpty.style.display = 'block';
    playBtn.disabled = true;
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }
  plEmpty.style.display = 'none';
  playBtn.disabled = false;
  prevBtn.disabled = playlist.length < 2;
  nextBtn.disabled = playlist.length < 2;
  skipBackBtn.disabled = false;
  skipFwdBtn.disabled = false;

  const items = playlist.map((t, i) => {
    const isActive = i === currentIndex;
    return `<div class="pl-item${isActive?' active':''}" data-idx="${i}">
      <span class="pl-playing-icon">${isActive ? (isPlaying ? '<span class="pl-eq"><i></i><i></i><i></i></span>' : '❚❚') : ''}</span>
      <span class="pl-num">${String(i+1).padStart(2,'0')}</span>
      <span class="pl-title">${escHtml(t.name)}</span>
      <span class="pl-dur">${fmtTime(t.duration)}</span>
      <span class="pl-del" data-del="${i}" title="削除">✕</span>
    </div>`;
  }).join('');
  playlistList.innerHTML = items;

  // Scroll active item into view
  const activeEl = playlistList.querySelector('.pl-item.active');
  if (activeEl) activeEl.scrollIntoView({block:'nearest'});

  // Click handlers
  playlistList.querySelectorAll('.pl-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.classList.contains('pl-del')) return;
      const idx = parseInt(el.dataset.idx);
      if (idx === currentIndex) {
        // Toggle play/pause
        if (isPlaying) pauseTrack(); else resumeTrack();
      } else {
        playTrack(idx);
      }
    });
  });
  playlistList.querySelectorAll('.pl-del').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      removeTrack(parseInt(el.dataset.del));
    });
  });
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 曲名表示:収まらん時だけ往復スクロールを有効化
let _tnText = '';
function setTrackName(text) {
  _tnText = text;
  trackName.classList.remove('marquee');
  trackName.style.removeProperty('--tn-shift');
  trackName.style.removeProperty('--tn-dur');
  trackName.textContent = '';
  const inner = document.createElement('span');
  inner.className = 'track-name-inner';
  inner.textContent = text;
  trackName.appendChild(inner);
  // レイアウト確定後に幅を測定
  requestAnimationFrame(() => {
    if (inner.parentNode !== trackName) return; // 測定前に曲が変わった場合は無視
    const over = inner.scrollWidth - trackName.clientWidth;
    if (over > 4) {
      const shift = over + 16; // 末尾に少し余白
      trackName.style.setProperty('--tn-shift', shift + 'px');
      // 距離に比例した時間=スクロール速度を一定に(最低8秒)
      trackName.style.setProperty('--tn-dur', Math.max(8, 4 + shift / 14) + 's');
      trackName.classList.add('marquee');
    }
  });
}
// 画面回転・ウィンドウリサイズでオーバーフロー量が変わるので再測定
let _tnResizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(_tnResizeT);
  _tnResizeT = setTimeout(() => { if (_tnText) setTrackName(_tnText); }, 250);
});

function removeTrack(idx) {
  playlist.splice(idx, 1);
  if (currentIndex === idx) {
    stopPlayback();
    if (playlist.length > 0) {
      playTrack(Math.min(idx, playlist.length - 1));
    } else {
      currentIndex = -1;
      setTrackName('— NO FILE LOADED —');
      durTime.textContent = '0:00';
      updateSeek(0);
      lufsIntAccum = 0; lufsIntCount = 0;
    }
  } else if (currentIndex > idx) {
    currentIndex--;
  }
  renderPlaylist();
}

clearBtn.addEventListener('click', () => {
  stopPlayback();
  playlist = [];
  currentIndex = -1;
  lufsIntAccum = 0; lufsIntCount = 0;
  setTrackName('— NO FILE LOADED —');
  durTime.textContent = '0:00';
  updateSeek(0);
  renderPlaylist();
});

// ── Shuffle / Repeat ──
shuffleBtn.addEventListener('click', () => {
  shuffleMode = !shuffleMode;
  shuffleBtn.classList.toggle('active', shuffleMode);
  if (shuffleMode) buildShuffleOrder();
});

repeatBtn.addEventListener('click', () => {
  const modes = ['none', 'all', 'one'];
  const labels = ['↺ REPEAT', '↺ ALL', '↺ ONE'];
  repeatMode = modes[(modes.indexOf(repeatMode) + 1) % modes.length];
  repeatBtn.textContent = labels[modes.indexOf(repeatMode)];
  repeatBtn.classList.toggle('active', repeatMode !== 'none');
});

function buildShuffleOrder() {
  shuffleOrder = [...Array(playlist.length).keys()];
  for (let i = shuffleOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
  }
}

function getNextIndex() {
  if (playlist.length === 0) return -1;
  if (repeatMode === 'one') return currentIndex;
  if (shuffleMode) {
    if (shuffleOrder.length === 0) buildShuffleOrder();
    const pos = shuffleOrder.indexOf(currentIndex);
    const nextPos = (pos + 1) % shuffleOrder.length;
    if (nextPos === 0 && repeatMode === 'none') return -1;
    return shuffleOrder[nextPos];
  }
  const next = currentIndex + 1;
  if (next >= playlist.length) return repeatMode === 'all' ? 0 : -1;
  return next;
}

function getPrevIndex() {
  if (playlist.length === 0) return -1;
  if (shuffleMode) {
    if (shuffleOrder.length === 0) buildShuffleOrder();
    const pos = shuffleOrder.indexOf(currentIndex);
    return shuffleOrder[(pos - 1 + shuffleOrder.length) % shuffleOrder.length];
  }
  return (currentIndex - 1 + playlist.length) % playlist.length;
}

prevBtn.addEventListener('click', () => {
  if (playlist.length < 2) return;
  playTrack(getPrevIndex());
});
nextBtn.addEventListener('click', () => {
  if (playlist.length < 2) return;
  const n = getNextIndex();
  if (n >= 0) playTrack(n); else { stopPlayback(); renderPlaylist(); }
});

function skipSeconds(sec) {
  if (!playlist[currentIndex]) return;
  const dur = playlist[currentIndex].duration;
  const current = isPlaying ? audioCtx.currentTime - startTime : pauseOffset;
  const newOffset = Math.max(0, Math.min(dur - 0.1, current + sec));
  pauseOffset = newOffset;
  updateSeek(newOffset / dur);
  if (isPlaying) startPlaybackFromOffset(newOffset);
}
skipBackBtn.addEventListener('click', () => skipSeconds(-5));
skipFwdBtn.addEventListener('click', () => skipSeconds(5));

// ── Playback ──
function playTrack(idx) {
  if (idx < 0 || idx >= playlist.length) return;
  currentIndex = idx;
  const track = playlist[idx];
  pauseOffset = 0;
  gatedBlocks = []; lufsBlocks = []; intLufsVal = -70;
  lufsBlockAccum = 0; lufsBlockCount = 0;
  // スライディングウィンドウもリセット(前曲のサンプルが残らないように)
  if (lufsRing) { lufsRing.fill(0); }
  lufsRingPos = 0; lufsRingSum = 0; lufsRingFilled = false; lufsRingCount = 0;
  lufsRingDriftCounter = 0; lufsRecalcSamples = 0;
  // 曲が変わったら累積最大ピークもリセット
  peakDbHold = -60; peakDbTimer = 0;
  kStateL = { hs: [0,0,0,0], hp: [0,0,0,0] };
  kStateR = { hs: [0,0,0,0], hp: [0,0,0,0] };
  setTrackName(track.name);
  msUpdateMeta();
  // Build static waveform overview
  setTimeout(() => { buildWaveformPeaks(); drawFullWaveform(); }, 50);
  durTime.textContent = fmtTime(track.duration);
  updateSeek(0);
  renderPlaylist();
  startPlaybackFromOffset(0);
}

function startPlaybackFromOffset(offset) {
  if (!playlist[currentIndex]) return;
  if (!audioCtx) { console.error('[AURA] no audioCtx'); return; }

  // 世代カウンタを進める ── これ以降に呼ばれた startPlaybackFromOffset が最新
  const myGen = ++startGen;

  // Tear down old source cleanly
  const oldSource = sourceNode;
  sourceNode = null;
  if (oldSource) {
    oldSource.onended = null; // prevent stale onended firing
    try { oldSource.stop(0); } catch(e){}
    try { oldSource.disconnect(); } catch(e){}
  }

  const buf = playlist[currentIndex].buffer;
  const safeOffset = Math.max(0, Math.min(offset, buf.duration - 0.01));

  const doStart = () => {
    // 自分より新しい startPlaybackFromOffset 呼び出しが来ていたら何もしない(二重再生防止)
    if (myGen !== startGen) return;
    // resume 待ち中に sourceNode に他の src が入った場合は念のため掃除
    if (sourceNode) {
      try { sourceNode.onended = null; sourceNode.stop(0); sourceNode.disconnect(); } catch(e){}
      sourceNode = null;
    }

    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    try {
      src.connect(analyser);
    } catch(e) {
      console.error('[AURA] src.connect failed:', e);
      return;
    }

    // ボリュームの保険(NaN/Infinity対策)
    let vol = parseFloat(volSlider.value);
    if (!isFinite(vol) || vol < 0) vol = 0.8;
    if (vol > 1) vol = 1;

    // Tiny gain ramp to eliminate pop on start
    try {
      gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.01);
    } catch(e) {
      gainNode.gain.value = vol;
    }

    try {
      src.start(0, safeOffset);
    } catch(e) {
      console.error('[AURA] src.start failed:', e);
      return;
    }
    sourceNode = src;
    startTime = audioCtx.currentTime - safeOffset;
    isPlaying = true;
    playBtn.textContent = '⏸';
    msSetState('playing');
    msUpdatePosition();

    src.onended = () => {
      if (sourceNode !== src) return; // stale event, ignore
      if (!isPlaying) return;
      isPlaying = false;
      playBtn.textContent = '▶';
      const next = getNextIndex();
      if (next >= 0) {
        playTrack(next);
      } else {
        pauseOffset = 0;
        updateSeek(0);
        renderPlaylist();
        msSetState('none');
      }
    };
  };

  // closed(OSに破棄済み)ならコンテキストごと作り直す。
  // AudioBufferはコンテキスト非依存なのでplaylistのバッファはそのまま使える。
  if (audioCtx.state === 'closed') {
    initAudioCtx();
    if (!audioCtx) { console.error('[AURA] audioCtx rebuild failed'); return; }
  }

  // running でなければ('suspended' と iOS独自の 'interrupted' の両方)
  // resume を待ってから再生開始する
  // (resume前に start() を呼ぶと一部環境で無音になる事がある)
  if (audioCtx.state !== 'running') {
    const p = audioCtx.resume();
    if (p && typeof p.then === 'function') {
      p.then(doStart).catch(err => {
        console.error('[AURA] resume failed, starting anyway:', err);
        doStart();
      });
    } else {
      doStart();
    }
  } else {
    doStart();
  }
}

function pauseTrack() {
  if (!isPlaying) return;
  pauseOffset = audioCtx.currentTime - startTime;
  isPlaying = false;
  playBtn.textContent = '▶';
  msSetState('paused');
  msUpdatePosition();
  const src = sourceNode;
  sourceNode = null;
  if (src) {
    src.onended = null;
    // Ramp down then stop to avoid pop
    gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
    gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.015);
    try { src.stop(audioCtx.currentTime + 0.02); } catch(e){}
    setTimeout(() => {
      try { src.disconnect(); } catch(e){}
      // Restore gain for next play
      gainNode.gain.setValueAtTime(parseFloat(volSlider.value), audioCtx.currentTime);
    }, 30);
  }
  renderPlaylist();
}

function resumeTrack() {
  if (isPlaying || !playlist[currentIndex] || !audioCtx) return;
  // closed/interrupted の復旧は startPlaybackFromOffset 側が面倒を見る
  startPlaybackFromOffset(pauseOffset);
  renderPlaylist();
}

function stopPlayback() {
  const src = sourceNode;
  sourceNode = null;
  if (src) {
    src.onended = null;
    try { src.stop(0); } catch(e){}
    try { src.disconnect(); } catch(e){}
  }
  isPlaying = false;
  pauseOffset = 0;
  playBtn.textContent = '▶';
  msSetState('none');
}

playBtn.addEventListener('click', () => {
  if (playlist.length === 0 || !audioCtx) return;
  if (ctxNeedsResume()) { const p = audioCtx.resume(); if (p && p.catch) p.catch(()=>{}); }
  if (currentIndex === -1) { playTrack(0); return; }
  if (isPlaying) pauseTrack(); else resumeTrack();
});

// ── Media Session(ロック画面・通知センターの再生コントロール)──
// 対応ブラウザでは、ロック画面や通知に曲名と再生/次へ/前へボタンが出る
function msUpdateMeta() {
  if (!('mediaSession' in navigator)) return;
  try {
    const t = playlist[currentIndex];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t ? t.name : 'AURA',
      artist: 'AURA PLAYER',
      album: 'Local Files'
    });
  } catch(_){}
}
function msSetState(state) {
  if (!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.playbackState = state; } catch(_){}
}
// OS側のシークバーに曲の長さと現在位置を伝える(再生中はOSが自動で進めてくれる)
function msUpdatePosition() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  const t = playlist[currentIndex];
  if (!t) return;
  try {
    const pos = isPlaying ? Math.max(0, audioCtx.currentTime - startTime) : pauseOffset;
    navigator.mediaSession.setPositionState({
      duration: t.duration,
      position: Math.min(pos, t.duration),
      playbackRate: 1
    });
  } catch(_){}
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const safe = (action, fn) => { try { ms.setActionHandler(action, fn); } catch(_){} };
  safe('play',          () => { if (ctxNeedsResume()) { const p = audioCtx.resume(); if (p && p.catch) p.catch(()=>{}); } resumeTrack(); });
  safe('pause',         () => pauseTrack());
  safe('previoustrack', () => { if (playlist.length) playTrack(getPrevIndex()); });
  safe('nexttrack',     () => { const n = getNextIndex(); if (n >= 0) playTrack(n); });
  safe('seekbackward',  (d) => skipSeconds(-(d && d.seekOffset || 5)));
  safe('seekforward',   (d) => skipSeconds(d && d.seekOffset || 5));
  safe('seekto',        (d) => { if (d && typeof d.seekTime === 'number' && playlist[currentIndex]) { const r = d.seekTime / playlist[currentIndex].duration; applySeek(Math.max(0, Math.min(1, r))); } });
}

// ── Seek bar ──
let isDragging = false;
function getClientX(e) {
  try {
    if (e.touches && e.touches.length > 0) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0].clientX;
    return e.clientX || 0;
  } catch(_) { return 0; }
}
function seekRatio(e) {
  const rect = seekWrap.getBoundingClientRect();
  return Math.max(0, Math.min(1, (getClientX(e) - rect.left) / rect.width));
}
function updateSeek(ratio) {
  if (seekFill) seekFill.style.width = (ratio * 100) + '%';
  if (seekThumb) seekThumb.style.left = (ratio * 100) + '%';
  if (playlist[currentIndex]) curTime.textContent = fmtTime(ratio * playlist[currentIndex].duration);
}
function applySeek(ratio) {
  if (!playlist[currentIndex]) return;
  pauseOffset = ratio * playlist[currentIndex].buffer.duration;
  updateSeek(ratio);
  if (isPlaying) startPlaybackFromOffset(pauseOffset);
}
seekWrap.addEventListener('mousedown', e => { e.preventDefault(); isDragging = true; seekWrap.classList.add('dragging'); applySeek(seekRatio(e)); });
seekWrap.addEventListener('touchstart', e => { isDragging = true; seekWrap.classList.add('dragging'); applySeek(seekRatio(e)); }, {passive:true});
window.addEventListener('mousemove', e => { if (isDragging) updateSeek(seekRatio(e)); });
window.addEventListener('touchmove', e => { if (!isDragging) return; try { updateSeek(seekRatio(e)); } catch(_){} }, {passive:true});
window.addEventListener('mouseup', e => { if (isDragging) { isDragging = false; seekWrap.classList.remove('dragging'); applySeek(seekRatio(e)); } });
window.addEventListener('touchend', e => { if (!isDragging) return; isDragging = false; seekWrap.classList.remove('dragging'); try { applySeek(seekRatio(e)); } catch(_){} });

// ── Mic removed ──

// ── Drag & Drop (複数対応) ──
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add('dragging'); if(dropBox) dropBox.classList.add('drag-over'); }));
document.addEventListener('dragleave', e => { if (!e.relatedTarget || e.relatedTarget === document.documentElement) { document.body.classList.remove('dragging'); if(dropBox) dropBox.classList.remove('drag-over'); } });
document.addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('dragging'); if(dropBox) dropBox.classList.remove('drag-over');
  if (e.dataTransfer.files.length > 0) loadFiles(e.dataTransfer.files);
