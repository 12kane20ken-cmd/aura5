<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AURA</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AURA">
<meta name="theme-color" content="#040310">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,200;0,300;0,400;0,600;0,700;1,200&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Duality: --ac/--ac2/--conf はJSテーマエンジンが毎秒更新 */
  --ac:112,132,166;          /* accent  静寂=黒青 → 高揚=白青 */
  --ac2:142,158,188;         /* secondary 黒青系 → 青白系 */
  --conf:0;                  /* conflict 0..1 */
  --hot:255,88,142;
  --ink:#040310;
  --text:rgba(228,238,252,0.88);
  --dim:rgba(var(--ac2),0.42);
  --font:'Exo 2',sans-serif;
  --mono:'Share Tech Mono',monospace;
  --r:14px;
}

html,body{
  width:100%;height:100%;
  background:var(--ink);
  overflow:hidden;
  color:var(--text);
  font-family:var(--font);
}

/* ── 虚空：二層のオーロラ。光側と紛争側がconfでクロスフェード ── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 95% 60% at 16% -5%, rgba(78,104,150,0.13) 0%, transparent 62%),
    radial-gradient(ellipse 70% 45% at 88% 105%, rgba(96,112,150,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 50%, rgba(7,9,28,1) 35%, rgba(4,3,16,1) 100%);
  opacity:calc(1 - var(--conf)*0.8);
  transition:opacity 0.6s linear;
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 95% 60% at 84% -5%, rgba(214,228,248,0.13) 0%, transparent 62%),
    radial-gradient(ellipse 70% 45% at 10% 105%, rgba(150,82,255,0.13) 0%, transparent 60%);
  opacity:var(--conf);
  transition:opacity 0.6s linear;
}

.app{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}

/* ── ガラス板の共通レシピ ── */
.viz-wrap,.scroll-wf-card,.meter-card,.panel-canvas-wrap,
.seek-canvas-wrap,.playlist-list{
  background:linear-gradient(165deg, rgba(255,255,255,0.045) 0%, rgba(255,255,255,0.012) 60%, rgba(var(--ac),0.025) 100%);
  border:1px solid rgba(var(--ac),0.13);
  border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 28px rgba(0,0,0,0.35);
  backdrop-filter:blur(12px) saturate(135%);
  -webkit-backdrop-filter:blur(12px) saturate(135%);
}

/* ── Header ── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 8px;
  flex-shrink:0;
  position:relative;
}
/* デュアリティ・ホライズン：光の線の上に、紛争の線がconfで重なる */
.header::after{
  content:'';position:absolute;bottom:0;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--ac),0.7) 35%,rgba(var(--ac2),0.5) 65%,transparent);
  box-shadow:0 0 12px rgba(var(--ac),0.5);
}
.header::before{
  content:'';position:absolute;bottom:0;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--hot),0.9) 70%,transparent);
  box-shadow:0 0 14px rgba(var(--hot),0.6);
  opacity:var(--conf);
  transition:opacity 0.6s linear;
}
.logo{
  font-family:var(--font);font-weight:700;font-size:20px;
  letter-spacing:0.24em;
  background:linear-gradient(100deg,#fff 25%,rgba(var(--ac),1) 70%,rgba(var(--ac2),1) 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(var(--ac),0.45));
}
.logo em{font-style:normal;}
.header-right{
  font-family:var(--mono);font-size:8px;
  color:var(--dim);letter-spacing:0.25em;text-align:right;line-height:1.6;
}
.header-right .live{color:rgba(var(--ac),0.9);animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}

/* ── Top section: Imager + Meters ── */
.top-section{
  display:flex;gap:6px;
  flex-shrink:0;
  position:relative;
  align-items:stretch;
  padding:0 12px;
  overflow:hidden;
}
.viz-wrap{
  flex:1;
  position:relative;overflow:hidden;
  cursor:pointer;
}
.viz-wrap canvas{display:block;width:100%;height:100%;}
.viz-wrap::before{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  border-radius:var(--r);
  background:linear-gradient(150deg,rgba(255,255,255,0.05) 0%,transparent 35%);
}

.right-panel{
  display:flex;flex-direction:column;
  width:96px;flex-shrink:0;
  gap:6px;
}
.scroll-wf-card{
  width:44px;flex-shrink:0;
  overflow:hidden;
  display:flex;flex-direction:column;
}
.scroll-wf-card .meter-label{padding:4px 5px 2px;font-size:6px;}
.scroll-wf-card canvas{flex:1;display:block;width:100%;}
.meter-card{
  flex:1;
  padding:7px 9px;
  position:relative;
  overflow:hidden;
}
.meter-card-inner{display:flex;align-items:stretch;gap:6px;height:100%;}
.meter-card-inner > div{flex:1;display:flex;flex-direction:column;justify-content:center;}
.bar-canvas{
  width:18px;flex-shrink:0;display:block;
  border-left:1px solid rgba(var(--ac),0.10);
}
.meter-label{
  font-family:var(--font);font-weight:600;
  font-size:7px;letter-spacing:0.35em;
  color:var(--dim);text-transform:uppercase;margin-bottom:3px;
}
.meter-val{
  font-family:var(--mono);font-size:19px;
  color:#fff;line-height:1;
  white-space:nowrap;overflow:hidden;
  text-shadow:0 0 14px rgba(var(--ac),0.55);
}
.meter-unit{font-size:8px;color:rgba(var(--ac),0.9);margin-left:1px;vertical-align:super;}
.meter-sub{
  font-family:var(--mono);font-size:7px;color:var(--dim);
  letter-spacing:0.08em;margin-top:3px;
  white-space:nowrap;overflow:hidden;height:10px;
}
.lufs-bar-wrap{margin-top:3px;height:2px;background:rgba(var(--ac),0.10);border-radius:1px;overflow:hidden;}
.lufs-bar-fill{height:100%;border-radius:1px;transition:width 0.1s;}

/* ── Spectrum ── */
.eq-section{flex-shrink:0;margin:8px 12px 0;}
.panel-label{
  font-family:var(--font);font-weight:300;font-style:italic;
  font-size:8px;letter-spacing:0.4em;color:var(--dim);
  text-transform:uppercase;margin-bottom:4px;padding-left:4px;
}
.panel-canvas-wrap{position:relative;overflow:hidden;}
#eqCanvas{width:100%;height:68px;display:block;position:relative;z-index:0;}

/* ── Seekbar waveform ── */
.seek-section{flex-shrink:0;margin:8px 12px 0;}
.seek-canvas-wrap{
  position:relative;
  overflow:hidden;
  height:52px;
  cursor:pointer;
}
#seekWfCanvas{display:block;width:100%;height:100%;position:absolute;top:0;left:0;}
.seek-fill-line{
  position:absolute;top:0;bottom:0;left:0;width:0%;
  background:rgba(var(--ac),0.08);z-index:2;pointer-events:none;
  border-right:1px solid rgba(var(--ac),0.65);
  box-shadow:2px 0 14px rgba(var(--ac),0.35);
}
.seek-thumb-line{
  position:absolute;top:0;bottom:0;left:0%;
  width:2px;background:rgba(var(--ac),1);z-index:3;pointer-events:none;
  box-shadow:0 0 8px rgba(var(--ac),0.8);
  transform:translateX(-50%);
  display:none;
}
.seek-canvas-wrap:hover .seek-thumb-line,
.seek-canvas-wrap.dragging .seek-thumb-line{display:block;}
.seek-times-row{
  display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:9px;color:var(--dim);
  margin-top:4px;padding:0 4px;
}

/* ── Playlist ── */
.playlist-section{
  flex-shrink:0;margin:8px 12px 0;
  flex:1;min-height:0;
  display:flex;flex-direction:column;
}
.playlist-header{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.pl-count-badge{
  font-family:var(--mono);font-size:8px;color:rgba(var(--ac),0.95);
  background:rgba(var(--ac),0.07);
  border:1px solid rgba(var(--ac),0.18);
  border-radius:999px;
  padding:3px 9px;
  margin-right:auto;
}
.pl-btn{
  background:linear-gradient(165deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015));
  border:1px solid rgba(var(--ac),0.13);
  border-radius:9px;
  color:var(--dim);
  font-family:var(--mono);font-size:8px;letter-spacing:0.15em;
  padding:5px 9px;cursor:pointer;text-transform:uppercase;
  transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.pl-btn:active{background:rgba(var(--ac),0.12);border-color:rgba(var(--ac),0.35);color:#fff;}
.pl-btn.active{background:rgba(var(--ac),0.10);border-color:rgba(var(--ac),0.55);color:rgba(var(--ac),1);}

.playlist-list{
  flex:1;
  overflow-y:auto;
  min-height:40px;
}
.playlist-list::-webkit-scrollbar{width:2px;}
.playlist-list::-webkit-scrollbar-thumb{background:rgba(var(--ac),0.25);}
.pl-empty{padding:14px;text-align:center;font-family:var(--mono);font-size:8px;color:var(--dim);letter-spacing:0.25em;}
.pl-item{
  display:flex;align-items:center;gap:6px;padding:6px 12px;
  border-bottom:1px solid rgba(var(--ac),0.05);
  cursor:pointer;transition:background 0.1s;user-select:none;
}
.pl-item:last-child{border-bottom:none;}
.pl-item:active{background:rgba(var(--ac),0.06);}
.pl-item.active{
  background:linear-gradient(90deg,rgba(var(--ac),0.10),rgba(var(--ac),0.02));
  border-left:2px solid rgba(var(--ac),1);
}
.pl-item.active .pl-title{color:#fff;}
.pl-num{font-family:var(--mono);font-size:8px;color:var(--dim);min-width:16px;text-align:right;}
.pl-item.active .pl-num{color:rgba(var(--ac),1);}
.pl-title{font-family:var(--font);font-weight:300;font-size:11px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl-dur{font-family:var(--mono);font-size:8px;color:var(--dim);white-space:nowrap;}
.pl-del{font-size:10px;color:var(--dim);padding:0 2px;opacity:0;transition:opacity 0.1s;cursor:pointer;}
.pl-item:hover .pl-del{opacity:0.6;}
.pl-icon{font-size:7px;color:rgba(var(--ac),0.9);min-width:10px;}

/* ── Player ── */
.player{
  flex-shrink:0;
  padding:9px 12px;
  padding-bottom:max(9px,env(safe-area-inset-bottom));
  position:relative;
}
.player::before{
  content:'';position:absolute;top:0;left:12px;right:12px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--ac),0.30),transparent);
}
.now-playing{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;overflow:hidden;}
.now-playing-label{
  font-family:var(--font);font-weight:200;font-style:italic;
  font-size:8px;letter-spacing:0.35em;color:var(--dim);
  text-transform:uppercase;white-space:nowrap;flex-shrink:0;
}
.track-name{
  font-family:var(--font);font-weight:600;font-size:14px;
  color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  text-shadow:0 0 20px rgba(var(--ac),0.55);
}

/* Controls */
.controls-wrap{display:flex;flex-direction:column;gap:7px;}
.controls-row{display:flex;align-items:center;gap:5px;}

.btn{
  background:linear-gradient(165deg,rgba(255,255,255,0.055),rgba(255,255,255,0.015));
  border:1px solid rgba(var(--ac),0.14);
  border-radius:12px;
  color:var(--text);
  font-family:var(--mono);font-size:10px;letter-spacing:0.1em;
  padding:0;cursor:pointer;text-transform:uppercase;
  transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
  height:42px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.07);
}
.btn::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--ac2),0.25),transparent);
}
.btn:active{
  background:rgba(var(--ac),0.13);
  border-color:rgba(var(--ac),0.4);
  color:#fff;
}
.btn:disabled{opacity:0.2;cursor:default;}
.btn.active{background:rgba(var(--ac),0.10);border-color:rgba(var(--ac),0.55);color:rgba(var(--ac),1);}

.play-btn{
  font-size:20px;width:54px;
  border-radius:21px;
  background:linear-gradient(165deg,rgba(var(--ac),0.16),rgba(var(--ac),0.05));
  border-color:rgba(var(--ac),0.4);
  color:#fff;
  box-shadow:0 0 20px rgba(var(--ac),0.18), inset 0 1px 0 rgba(255,255,255,0.12);
}
.play-btn:active{background:rgba(var(--ac),0.24);}

.nav-btn{font-size:16px;width:40px;}
.skip-btn{font-size:10px;width:44px;letter-spacing:0.05em;}
.load-btn{font-size:9px;padding:0 12px;letter-spacing:0.2em;flex:1;}
.vol-wrap{
  display:flex;align-items:center;gap:6px;flex:2;
  font-family:var(--mono);font-size:7px;letter-spacing:0.2em;color:var(--dim);
}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:2px;
  background:rgba(var(--ac),0.16);outline:none;border-radius:1px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:rgba(var(--ac),1);
  box-shadow:0 0 8px rgba(var(--ac),0.6);cursor:pointer;
}

/* ── Drop overlay ── */
.drop-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(4,3,16,0.55);
  backdrop-filter:blur(28px) saturate(130%);
  -webkit-backdrop-filter:blur(28px) saturate(130%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
}
.drop-overlay.hidden{display:none;}
.drop-logo{
  font-family:var(--font);font-weight:700;font-size:36px;
  letter-spacing:0.28em;
  background:linear-gradient(100deg,#fff 25%,rgba(var(--ac),1) 70%,rgba(var(--ac2),1) 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 24px rgba(var(--ac),0.5));
}
.drop-logo em{font-style:normal;}
.file-label{
  border:1px solid rgba(var(--ac),0.35);color:#fff;
  border-radius:999px;
  font-family:var(--font);font-weight:600;font-size:14px;letter-spacing:0.3em;
  padding:16px 48px;cursor:pointer;text-transform:uppercase;display:inline-block;
  transition:all 0.15s;
  background:linear-gradient(165deg,rgba(var(--ac),0.10),rgba(var(--ac),0.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.1), 0 0 28px rgba(var(--ac),0.12);
}
.file-label:active{background:rgba(var(--ac),0.18);border-color:rgba(var(--ac),0.7);}
.drop-sub2{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:0.2em;}

/* ── A11y / motion ── */
:focus-visible{outline:1.5px solid rgba(var(--ac),0.8);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  .header-right .live{animation:none;}
  body::before,body::after,.header::before{transition:none;}
}
</style>
</head>
<body>

<!-- Drop overlay -->
<div class="drop-overlay" id="dropOverlay">
  <div class="drop-logo">AU<em>R</em>A</div>
  <label class="file-label" for="fileInput">ファイルを選択</label>
  <input type="file" id="fileInput" accept=".mp3,.wav,.aac,.flac,.ogg,.m4a,.aiff,.opus,audio/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
  <div class="drop-sub2">MP3 · WAV · FLAC · M4A · 複数可</div>
</div>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="logo">AU<em>R</em>A</div>
    <div class="header-right">
      <div class="live" id="headerStatus">● ANALYZER</div>
      <div>STEREO IMAGER · B8</div>
    </div>
  </div>

  <!-- Imager | Live WF | Meters -->
  <div class="top-section">
    <div class="viz-wrap">
      <canvas id="imagerCanvas"></canvas>
    </div>
    <div class="scroll-wf-card">
      <div class="meter-label">Live</div>
      <canvas id="wfCanvas"></canvas>
    </div>
    <div class="right-panel">
      <div class="meter-card">
        <div class="meter-card-inner">
          <div>
            <div class="meter-label">LUFS-M</div>
            <div class="meter-val" id="lufsVal">—<span class="meter-unit">LU</span></div>
            <div class="lufs-bar-wrap"><div class="lufs-bar-fill" id="lufsBar" style="width:0%"></div></div>
            <div class="meter-sub" id="lufsIntVal">INT —</div>
          </div>
          <canvas class="bar-canvas" id="lufsBarCanvas"></canvas>
        </div>
      </div>
      <div class="meter-card">
        <div class="meter-card-inner">
          <div>
            <div class="meter-label">Peak</div>
            <div class="meter-val" id="peakVal">—<span class="meter-unit">dB</span></div>
            <div class="meter-sub" id="peakHoldVal">HOLD —</div>
          </div>
          <canvas class="bar-canvas" id="peakBarCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Spectrum -->
  <div class="eq-section">
    <div class="panel-label">Spectrum</div>
    <div class="panel-canvas-wrap">
      <canvas id="eqCanvas" height="68"></canvas>
    </div>
  </div>

  <!-- Seek + Waveform (combined) -->
  <div class="seek-section">
    <div class="panel-label">Waveform</div>
    <div class="seek-canvas-wrap" id="seekWrap">
      <canvas id="seekWfCanvas"></canvas>
      <div class="seek-fill-line" id="seekFill"></div>
      <div class="seek-thumb-line" id="seekThumb"></div>
    </div>
    <div class="seek-times-row">
      <span id="curTime">0:00</span>
      <span id="durTime">0:00</span>
    </div>
  </div>

  <!-- Playlist -->
  <div class="playlist-section">
    <div class="playlist-header">
      <div class="pl-count-badge">PLAYLIST · <span id="plCount">0</span></div>
      <div style="display:flex;gap:4px;">
        <button class="pl-btn" id="shuffleBtn">⇄ SHUF</button>
        <button class="pl-btn" id="repeatBtn">↺ REP</button>
        <label class="pl-btn" for="fileInput2">＋ ADD</label>
        <input type="file" id="fileInput2" accept=".mp3,.wav,.aac,.flac,.ogg,.m4a,.aiff,.opus,audio/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
        <button class="pl-btn" id="clearBtn">✕</button>
      </div>
    </div>
    <div class="playlist-list" id="playlistList">
      <div class="pl-empty" id="plEmpty">— ADD でファイルを追加 —</div>
    </div>
  </div>

  <!-- Player -->
  <div class="player">
    <div class="now-playing" style="margin-bottom:4px;">
      <span class="now-playing-label">Now Playing</span>
      <span class="track-name" id="trackName">—</span>
    </div>
    <div class="controls-wrap">
      <div class="controls-row">
        <button class="btn nav-btn" id="prevBtn" disabled>⏮</button>
        <button class="btn skip-btn" id="skipBackBtn" disabled>«5s</button>
        <button class="btn play-btn" id="playBtn" disabled>▶</button>
        <button class="btn skip-btn" id="skipFwdBtn" disabled>5s»</button>
        <button class="btn nav-btn" id="nextBtn" disabled>⏭</button>
      </div>
      <div class="controls-row">
        <label class="btn load-btn" for="fileInput3">⊕ LOAD</label>
        <input type="file" id="fileInput3" accept=".mp3,.wav,.aac,.flac,.ogg,.m4a,.aiff,.opus,audio/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
        <div class="vol-wrap">
          <span>VOL</span>
          <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </div>
  </div>

</div>

<script>

// ── Canvases ──
const imagerCanvas = document.getElementById('imagerCanvas');
const ic = imagerCanvas.getContext('2d');
const eqCanvas = document.getElementById('eqCanvas');

// ── HiDPI(Retina)対応 ──
// スマホは1CSSピクセル=2〜3実ピクセル。canvasの内部解像度を上げんとぼやける。
// 3倍はフルやと描画負荷が9倍になるので2でキャップ。
const DPR = Math.min(window.devicePixelRatio || 1, 2);
function cw(c){ return c.width / DPR; }   // 論理(CSS)幅
function ch(c){ return c.height / DPR; }  // 論理(CSS)高さ
function setHiDPI(c, ctx, w, h){
  if (!c || !ctx) return;
  c.width = Math.round(w * DPR);
  c.height = Math.round(h * DPR);
  // 以降の描画コードはCSSピクセル座標のままでOKにする
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// ── Audio context ──
function initAudioCtx() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // iOS unlock: play a silent buffer immediately on user gesture
  const silentBuf = audioCtx.createBuffer(1, 1, 22050);
  const silentSrc = audioCtx.createBufferSource();
  silentSrc.buffer = silentBuf;
  silentSrc.connect(audioCtx.destination);
  silentSrc.start(0);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 4096;
  analyser.smoothingTimeConstant = 0.75;
  // Stereo splitter for imager
  splitter = audioCtx.createChannelSplitter(2);
  analyserL = audioCtx.createAnalyser();
  analyserR = audioCtx.createAnalyser();
  analyserL.fftSize = 4096;
  analyserR.fftSize = 4096;
  analyserL.smoothingTimeConstant = 0.0;
  analyserR.smoothingTimeConstant = 0.0;
  gainNode = audioCtx.createGain();
  gainNode.gain.value = parseFloat(volSlider.value);
  // Limiter: prevents clipping even at max volume
  compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -1;
  compressor.knee.value = 0;
  compressor.ratio.value = 20;
  compressor.attack.value = 0.001;
  compressor.release.value = 0.1;
  // Graph: source -> analyser(main) -> gainNode -> compressor -> destination
  //                                             -> splitter -> analyserL/R
  analyser.connect(gainNode);
  gainNode.connect(compressor);
  compressor.connect(audioCtx.destination);
  gainNode.connect(splitter);
  splitter.connect(analyserL, 0);
  splitter.connect(analyserR, 1);
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
  freqArray = new Uint8Array(bufferLength);
}
volSlider.addEventListener('input', () => {

  gainNode.gain.setValueAtTime(parseFloat(volSlider.value), audioCtx.currentTime);
});

// Auto-resume AudioContext on iOS when returning to foreground
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().then(() => {
      // If was playing before suspend, restart playback
      if (isPlaying && playlist[currentIndex]) {
        const elapsed = audioCtx.currentTime - startTime;
        pauseOffset = Math.min(elapsed, playlist[currentIndex].duration - 0.1);
        startPlaybackFromOffset(pauseOffset);
      }
    });
  }
});

// iOS Safari: also resume on any touch/click after returning
function resumeOnInteraction() {
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().then(() => {
      if (isPlaying && playlist[currentIndex]) {
        const elapsed = audioCtx.currentTime - startTime;
        pauseOffset = Math.min(Math.max(0, elapsed), playlist[currentIndex].duration - 0.1);
        startPlaybackFromOffset(pauseOffset);
      }
    });
  }
}
document.addEventListener('touchstart', resumeOnInteraction, { passive: true });

// ── File loading ──
function isAudioFile(file) {
  return file.type.startsWith('audio/') || /\.(mp3|wav|aac|flac|ogg|m4a|aiff|opus)$/i.test(file.name);
}

function loadFiles(files) {
  if (!files || files.length === 0) return;
  // iOS requires AudioContext to be created inside a user gesture
  initAudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const audioFiles = Array.from(files).filter(isAudioFile);
  if (audioFiles.length === 0) {
    alert('対応しているオーディオファイルが見つかりませんでした');
    return;
  }
  dropOverlay.classList.add('hidden');

  let loaded = 0;
  const total = audioFiles.length;

  audioFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      // iOS Safari needs a copied buffer (slice) for decodeAudioData
      const arraybuf = e.target.result.slice(0);
      const promise = audioCtx.decodeAudioData(arraybuf, buf => {
        const name = file.name.replace(/\.[^.]+$/, '');
        playlist.push({ name, buffer: buf, duration: buf.duration });
        loaded++;
        renderPlaylist();
        if (loaded === total && currentIndex === -1) {
          playTrack(0);
        }
      }, err => {
        console.error('decodeAudioData error:', file.name, err);
        loaded++;
        if (loaded === total && currentIndex === -1 && playlist.length > 0) {
          playTrack(0);
        }
      });
      // Modern promise-based fallback
      if (promise && promise.catch) {
        promise.catch(err => console.error('decodeAudioData promise error:', file.name, err));
      }
    };
    reader.onerror = e => {
      console.error('FileReader error:', file.name, e);
      loaded++;
    };
    reader.readAsArrayBuffer(file);
  });
}

// ── Playlist UI ──
function renderPlaylist() {
  plCount.textContent = playlist.length;
  if (playlist.length === 0) {
    plEmpty.style.display = 'block';
    playBtn.disabled = true;
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }
  plEmpty.style.display = 'none';
  playBtn.disabled = false;
  prevBtn.disabled = playlist.length < 2;
  nextBtn.disabled = playlist.length < 2;
  skipBackBtn.disabled = false;
  skipFwdBtn.disabled = false;

  const items = playlist.map((t, i) => {
    const isActive = i === currentIndex;
    return `<div class="pl-item${isActive?' active':''}" data-idx="${i}">
      <span class="pl-playing-icon">${isActive ? (isPlaying ? '▶' : '❚❚') : ''}</span>
      <span class="pl-num">${String(i+1).padStart(2,'0')}</span>
      <span class="pl-title">${escHtml(t.name)}</span>
      <span class="pl-dur">${fmtTime(t.duration)}</span>
      <span class="pl-del" data-del="${i}" title="削除">✕</span>
    </div>`;
  }).join('');
  playlistList.innerHTML = items;

  // Scroll active item into view
  const activeEl = playlistList.querySelector('.pl-item.active');
  if (activeEl) activeEl.scrollIntoView({block:'nearest'});

  // Click handlers
  playlistList.querySelectorAll('.pl-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.classList.contains('pl-del')) return;
      const idx = parseInt(el.dataset.idx);
      if (idx === currentIndex) {
        // Toggle play/pause
        if (isPlaying) pauseTrack(); else resumeTrack();
      } else {
        playTrack(idx);
      }
    });
  });
  playlistList.querySelectorAll('.pl-del').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      removeTrack(parseInt(el.dataset.del));
    });
  });
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function removeTrack(idx) {
  playlist.splice(idx, 1);
  if (currentIndex === idx) {
    stopPlayback();
    if (playlist.length > 0) {
      playTrack(Math.min(idx, playlist.length - 1));
    } else {
      currentIndex = -1;
      trackName.textContent = '— NO FILE LOADED —';
      durTime.textContent = '0:00';
      updateSeek(0);
      lufsIntAccum = 0; lufsIntCount = 0;
    }
  } else if (currentIndex > idx) {
    currentIndex--;
  }
  renderPlaylist();
}

clearBtn.addEventListener('click', () => {

  playlist = [];

  lufsIntAccum = 0; lufsIntCount = 0;
  trackName.textContent = '— NO FILE LOADED —';

// ── Shuffle / Repeat ──
shuffleBtn.addEventListener('click', () => {
  shuffleMode = !shuffleMode;
  shuffleBtn.classList.toggle('active', shuffleMode);
  if (shuffleMode) buildShuffleOrder();
});

repeatBtn.addEventListener('click', () => {
  const modes = ['none', 'all', 'one'];
  const labels = ['↺ REPEAT', '↺ ALL', '↺ ONE'];
  repeatMode = modes[(modes.indexOf(repeatMode) + 1) % modes.length];
  repeatBtn.textContent = labels[modes.indexOf(repeatMode)];
  repeatBtn.classList.toggle('active', repeatMode !== 'none');
});

function buildShuffleOrder() {
  shuffleOrder = [...Array(playlist.length).keys()];
  for (let i = shuffleOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
  }
}

function getNextIndex() {
  if (playlist.length === 0) return -1;
  if (repeatMode === 'one') return currentIndex;
  if (shuffleMode) {
    if (shuffleOrder.length === 0) buildShuffleOrder();
    const pos = shuffleOrder.indexOf(currentIndex);
    const nextPos = (pos + 1) % shuffleOrder.length;
    if (nextPos === 0 && repeatMode === 'none') return -1;
    return shuffleOrder[nextPos];
  }
  const next = currentIndex + 1;
  if (next >= playlist.length) return repeatMode === 'all' ? 0 : -1;
  return next;
}

function getPrevIndex() {
  if (playlist.length === 0) return -1;
  if (shuffleMode) {
    if (shuffleOrder.length === 0) buildShuffleOrder();
    const pos = shuffleOrder.indexOf(currentIndex);
    return shuffleOrder[(pos - 1 + shuffleOrder.length) % shuffleOrder.length];
  }
  return (currentIndex - 1 + playlist.length) % playlist.length;
}

prevBtn.addEventListener('click', () => {
  if (playlist.length < 2) return;
  playTrack(getPrevIndex());
});
nextBtn.addEventListener('click', () => {
  if (playlist.length < 2) return;
  const n = getNextIndex();
  if (n >= 0) playTrack(n); else { stopPlayback(); renderPlaylist(); }
});

function skipSeconds(sec) {
  if (!playlist[currentIndex]) return;
  const dur = playlist[currentIndex].duration;
  const current = isPlaying ? audioCtx.currentTime - startTime : pauseOffset;
  const newOffset = Math.max(0, Math.min(dur - 0.1, current + sec));
  pauseOffset = newOffset;
  updateSeek(newOffset / dur);
  if (isPlaying) startPlaybackFromOffset(newOffset);
}
skipBackBtn.addEventListener('click', () => skipSeconds(-5));
skipFwdBtn.addEventListener('click', () => skipSeconds(5));

// ── Playback ──
function playTrack(idx) {
  if (idx < 0 || idx >= playlist.length) return;
  currentIndex = idx;
  const track = playlist[idx];
  pauseOffset = 0;
  gatedBlocks = []; lufsBlocks = []; intLufsVal = -70;
  lufsBlockAccum = 0; lufsBlockCount = 0;
  kStateL = { hs: [0,0,0,0], hp: [0,0,0,0] };
  kStateR = { hs: [0,0,0,0], hp: [0,0,0,0] };
  trackName.textContent = track.name;
  msUpdateMeta();
  // Build static waveform overview
  setTimeout(() => { buildWaveformPeaks(); drawFullWaveform(); }, 50);
  durTime.textContent = fmtTime(track.duration);
  updateSeek(0);
  renderPlaylist();
  startPlaybackFromOffset(0);
}

function startPlaybackFromOffset(offset) {
  if (!playlist[currentIndex]) return;
  // Resume context if suspended (browser autoplay policy)
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // Tear down old source cleanly
  const oldSource = sourceNode;
  sourceNode = null;
  if (oldSource) {
    oldSource.onended = null; // prevent stale onended firing
    try { oldSource.stop(0); } catch(e){}
    try { oldSource.disconnect(); } catch(e){}
  }

  const buf = playlist[currentIndex].buffer;
  const safeOffset = Math.max(0, Math.min(offset, buf.duration - 0.01));

  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(analyser);

  // Tiny gain ramp to eliminate pop on start
  gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
  gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
  gainNode.gain.linearRampToValueAtTime(parseFloat(volSlider.value), audioCtx.currentTime + 0.01);

  src.start(0, safeOffset);
  sourceNode = src;
  startTime = audioCtx.currentTime - safeOffset;
  isPlaying = true;
  playBtn.textContent = '⏸';
  msSetState('playing');
  msUpdatePosition();

  src.onended = () => {
    if (sourceNode !== src) return; // stale event, ignore
    if (!isPlaying) return;
    isPlaying = false;
    playBtn.textContent = '▶';
    const next = getNextIndex();
    if (next >= 0) {
      playTrack(next);
    } else {
      pauseOffset = 0;
      updateSeek(0);
      renderPlaylist();
      msSetState('none');
    }
  };
}

function pauseTrack() {
  if (!isPlaying) return;
  pauseOffset = audioCtx.currentTime - startTime;
  isPlaying = false;
  playBtn.textContent = '▶';
  msSetState('paused');
  msUpdatePosition();
  const src = sourceNode;
  sourceNode = null;
  if (src) {
    src.onended = null;
    // Ramp down then stop to avoid pop
    gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
    gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.015);
    try { src.stop(audioCtx.currentTime + 0.02); } catch(e){}
    setTimeout(() => {
      try { src.disconnect(); } catch(e){}
      // Restore gain for next play
      gainNode.gain.setValueAtTime(parseFloat(volSlider.value), audioCtx.currentTime);
    }, 30);
  }
  renderPlaylist();
}

function resumeTrack() {
  if (isPlaying || !playlist[currentIndex]) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  startPlaybackFromOffset(pauseOffset);
  renderPlaylist();
}

function stopPlayback() {
  const src = sourceNode;
  sourceNode = null;
  if (src) {
    src.onended = null;
    try { src.stop(0); } catch(e){}
    try { src.disconnect(); } catch(e){}
  }
  isPlaying = false;
  pauseOffset = 0;
  playBtn.textContent = '▶';
  msSetState('none');
}

playBtn.addEventListener('click', () => {
  if (playlist.length === 0) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (currentIndex === -1) { playTrack(0); return; }
  if (isPlaying) pauseTrack(); else resumeTrack();
});

// ── Media Session(ロック画面・通知センターの再生コントロール)──
// 対応ブラウザでは、ロック画面や通知に曲名と再生/次へ/前へボタンが出る
function msUpdateMeta() {
  if (!('mediaSession' in navigator)) return;
  try {
    const t = playlist[currentIndex];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t ? t.name : 'AURA',
      artist: 'AURA PLAYER',
      album: 'Local Files'
    });
  } catch(_){}
}
function msSetState(state) {
  if (!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.playbackState = state; } catch(_){}
}
// OS側のシークバーに曲の長さと現在位置を伝える(再生中はOSが自動で進めてくれる)
function msUpdatePosition() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  const t = playlist[currentIndex];
  if (!t) return;
  try {
    const pos = isPlaying ? Math.max(0, audioCtx.currentTime - startTime) : pauseOffset;
    navigator.mediaSession.setPositionState({
      duration: t.duration,
      position: Math.min(pos, t.duration),
      playbackRate: 1
    });
  } catch(_){}
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const safe = (action, fn) => { try { ms.setActionHandler(action, fn); } catch(_){} };
  safe('play',          () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); resumeTrack(); });
  safe('pause',         () => pauseTrack());
  safe('previoustrack', () => { if (playlist.length) playTrack(getPrevIndex()); });
  safe('nexttrack',     () => { const n = getNextIndex(); if (n >= 0) playTrack(n); });
  safe('seekbackward',  (d) => skipSeconds(-(d && d.seekOffset || 5)));
  safe('seekforward',   (d) => skipSeconds(d && d.seekOffset || 5));
  safe('seekto',        (d) => { if (d && typeof d.seekTime === 'number' && playlist[currentIndex]) { const r = d.seekTime / playlist[currentIndex].duration; applySeek(Math.max(0, Math.min(1, r))); } });
}

// ── Seek bar ──
let isDragging = false;
function getClientX(e) {
  try {
    if (e.touches && e.touches.length > 0) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0].clientX;
    return e.clientX || 0;
  } catch(_) { return 0; }
}
function seekRatio(e) {
  const rect = seekWrap.getBoundingClientRect();
  return Math.max(0, Math.min(1, (getClientX(e) - rect.left) / rect.width));
}
function updateSeek(ratio) {
  if (seekFill) seekFill.style.width = (ratio * 100) + '%';
  if (seekThumb) seekThumb.style.left = (ratio * 100) + '%';
  if (playlist[currentIndex]) curTime.textContent = fmtTime(ratio * playlist[currentIndex].duration);
}
function applySeek(ratio) {
  if (!playlist[currentIndex]) return;
  pauseOffset = ratio * playlist[currentIndex].buffer.duration;
  updateSeek(ratio);
  if (isPlaying) startPlaybackFromOffset(pauseOffset);
}
seekWrap.addEventListener('mousedown', e => { e.preventDefault(); isDragging = true; seekWrap.classList.add('dragging'); applySeek(seekRatio(e)); });
seekWrap.addEventListener('touchstart', e => { isDragging = true; seekWrap.classList.add('dragging'); applySeek(seekRatio(e)); }, {passive:true});
window.addEventListener('mousemove', e => { if (isDragging) updateSeek(seekRatio(e)); });
window.addEventListener('touchmove', e => { if (!isDragging) return; try { updateSeek(seekRatio(e)); } catch(_){} }, {passive:true});
window.addEventListener('mouseup', e => { if (isDragging) { isDragging = false; seekWrap.classList.remove('dragging'); applySeek(seekRatio(e)); } });
window.addEventListener('touchend', e => { if (!isDragging) return; isDragging = false; seekWrap.classList.remove('dragging'); try { applySeek(seekRatio(e)); } catch(_){} });

// ── Helpers ──
function fmtTime(s) { const m = Math.floor(s/60); return `${m}:${String(Math.floor(s%60)).padStart(2,'0')}`; }
function lerpC(a,b,t){
  const ah=parseInt(a.slice(1),16),bh=parseInt(b.slice(1),16);
  const ar=(ah>>16)&0xff,ag=(ah>>8)&0xff,ab=ah&0xff;
  const br=(bh>>16)&0xff,bg=(bh>>8)&0xff,bb=bh&0xff;
  return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
}

// ── BS.1770-4 LUFS implementation ──
// K-weighting filter coefficients for 48kHz (pre-filter + RLB)
// Will be recalculated on first use based on actual sampleRate
let kFilter = null;

function initKFilter(sampleRate) {
  // Stage 1: High-shelf pre-filter
  // H(s) = (s^2 + (Vh/Q)*s + Vh) / (s^2 + (1/Q)*s + 1)
  // Vh = 1.584864701, f0 = 1681.974450955, Q = 0.7071752369
  const f0 = 1681.974450955;
  const Q  = 0.7071752369;
  const Vh = 1.584864701;
  const K  = Math.tan(Math.PI * f0 / sampleRate);
  const Ks = K * K;
  const a0s = 1 + K / Q + Ks;
  const hs = {
    b0: (Vh + Vh / Q * K + Ks) / a0s,
    b1: 2 * (Ks - Vh) / a0s,
    b2: (Vh - Vh / Q * K + Ks) / a0s,
    a1: 2 * (Ks - 1) / a0s,
    a2: (1 - K / Q + Ks) / a0s
  };

  // Stage 2: High-pass RLB filter
  // f0 = 38.13547087602444, Q = 0.5003270373238773
  const f1 = 38.13547087602444;
  const Q1 = 0.5003270373238773;
  const K1 = Math.tan(Math.PI * f1 / sampleRate);
  const K1s = K1 * K1;
  const a0h = 1 + K1 / Q1 + K1s;
  const hp = {
    b0:  1 / a0h,
    b1: -2 / a0h,
    b2:  1 / a0h,
    a1: 2 * (K1s - 1) / a0h,
    a2: (1 - K1 / Q1 + K1s) / a0h
  };

  return { hs, hp };
}

// Filter state per channel (L/R)
let kStateL = { hs: [0,0,0,0], hp: [0,0,0,0] };
let kStateR = { hs: [0,0,0,0], hp: [0,0,0,0] };

function applyKWeight(samples, state, coefs) {
  const out = new Float32Array(samples.length);
  const { hs, hp } = coefs;
  let x1s = state.hs[0], x2s = state.hs[1], y1s = state.hs[2], y2s = state.hs[3];
  let x1h = state.hp[0], x2h = state.hp[1], y1h = state.hp[2], y2h = state.hp[3];

  for (let i = 0; i < samples.length; i++) {
    // Stage 1: high-shelf
    const xs = samples[i];
    const ys = hs.b0 * xs + hs.b1 * x1s + hs.b2 * x2s - hs.a1 * y1s - hs.a2 * y2s;
    x2s = x1s; x1s = xs; y2s = y1s; y1s = ys;
    // Stage 2: high-pass
    const xh = ys;
    const yh = hp.b0 * xh + hp.b1 * x1h + hp.b2 * x2h - hp.a1 * y1h - hp.a2 * y2h;
    x2h = x1h; x1h = xh; y2h = y1h; y1h = yh;
    out[i] = yh;
  }
  state.hs = [x1s, x2s, y1s, y2s];
  state.hp = [x1h, x2h, y1h, y2h];
  return out;
}

// Momentary LUFS: 400ms block history
const LUFS_BLOCK_MS = 400;
let lufsBlocks = []; // mean-square values per block
let lufsBlockAccum = 0;
let lufsBlockCount = 0;
let lufsBlockSize = 0; // samples per 400ms block

function calcLUFS(timeDomain) {
  // Legacy fallback for mono (used for draw loop meter only)
  let sum = 0;
  for (let i = 0; i < timeDomain.length; i++) {
    const v = (timeDomain[i] / 128) - 1;
    sum += v * v;
  }
  const ms = sum / timeDomain.length;
  return ms > 0 ? Math.max(-70, -0.691 + 10 * Math.log10(ms)) : -70;
}

function calcLUFSProper(bufL, bufR, sampleRate) {
  if (!kFilter) kFilter = initKFilter(sampleRate);
  if (lufsBlockSize === 0) lufsBlockSize = Math.round(sampleRate * LUFS_BLOCK_MS / 1000);

  const wL = applyKWeight(bufL, kStateL, kFilter);
  const wR = applyKWeight(bufR, kStateR, kFilter);

  // Mean square for this frame
  let msL = 0, msR = 0;
  for (let i = 0; i < wL.length; i++) { msL += wL[i] * wL[i]; msR += wR[i] * wR[i]; }
  msL /= wL.length; msR /= wR.length;
  const ms = msL + msR; // BS.1770-4: sum channels, do not average

  // Accumulate into 400ms block
  lufsBlockAccum += ms * wL.length;
  lufsBlockCount += wL.length;

  let momentary = -70;
  if (lufsBlockCount >= lufsBlockSize) {
    const blockMs = lufsBlockAccum / lufsBlockCount;
    lufsBlockAccum = 0; lufsBlockCount = 0;
    lufsBlocks.push(blockMs);
    if (lufsBlocks.length > 8) lufsBlocks.shift();
  }

  // 瞬間値：最新ブロック1つだけ使用
  if (lufsBlocks.length > 0) {
    const lastMs = lufsBlocks[lufsBlocks.length - 1];
    momentary = lastMs > 0 ? Math.max(-70, -0.691 + 10 * Math.log10(lastMs)) : -70;
  }

  return momentary;
}

// Integrated LUFS with gating (BS.1770-4)
let gatedBlocks = [];
let intLufsVal = -70;

function updateIntegratedLUFS(momentary) {
  if (!isPlaying) return;
  // Absolute gate: -70 LUFS
  if (momentary > -70) gatedBlocks.push(momentary);
  // Relative gate: -10 LU below ungated average
  if (gatedBlocks.length > 0) {
    const ungated = gatedBlocks.reduce((a, b) => a + b, 0) / gatedBlocks.length;
    const relGate = ungated - 10;
    const gated2 = gatedBlocks.filter(v => v > relGate);
    if (gated2.length > 0) {
      intLufsVal = gated2.reduce((a, b) => a + b, 0) / gated2.length;
    }
  }
}

// ── Bar Meter drawing ──
// ── Duality theme engine ──
// LUFS-MがUI全体の色温度を支配する。静寂=黒青 / ラウド=白青(どちらも低彩度)。
// 上昇(加熱)は速く、下降(冷却)はゆっくり。CSS変数は約10Hzで更新。
const TH = { c:0, r:112, g:132, b:166, s:'112,132,166', s2:'142,158,188', sd:'47,58,76' };
const TH_LIGHT=[112,132,166],  TH_CONF=[212,226,244];
const TH_LIGHT2=[142,158,188], TH_CONF2=[232,240,250];
let thLastT=0, thFrame=0;
function updateTheme(lufs){
  const now=vzRafTs||performance.now();
  const dt=thLastT?Math.min((now-thLastT)/1000,0.05):0.016;
  thLastT=now;
  const lr=(typeof lufs==='number'&&lufs>-70)?lufs:-70;
  const target=Math.max(0,Math.min(1,(lr+16)/9));
  const k=target>TH.c ? 1-Math.pow(0.05,dt) : 1-Math.pow(0.72,dt);
  TH.c+=(target-TH.c)*k;
  const m=TH.c, mx=(a,b)=>Math.round(a+(b-a)*m);
  TH.r=mx(TH_LIGHT[0],TH_CONF[0]); TH.g=mx(TH_LIGHT[1],TH_CONF[1]); TH.b=mx(TH_LIGHT[2],TH_CONF[2]);
  TH.s=TH.r+','+TH.g+','+TH.b;
  TH.s2=mx(TH_LIGHT2[0],TH_CONF2[0])+','+mx(TH_LIGHT2[1],TH_CONF2[1])+','+mx(TH_LIGHT2[2],TH_CONF2[2]);
  TH.sd=Math.round(TH.r*0.42)+','+Math.round(TH.g*0.44)+','+Math.round(TH.b*0.46);
  if((thFrame++%6)===0){
    const st=document.documentElement.style;
    st.setProperty('--ac',TH.s);
    st.setProperty('--ac2',TH.s2);
    st.setProperty('--conf',TH.c.toFixed(3));
  }
}

function drawBarMeter(ctx, canvas, valueDB, holdDB, label) {
  if (!ctx || !canvas) return;
  const W = canvas.offsetWidth * (window.devicePixelRatio || 1);
  const H = canvas.offsetHeight * (window.devicePixelRatio || 1);
  if (W < 1 || H < 1) return;
  if (canvas.width !== W || canvas.height !== H) {
    canvas.width = W; canvas.height = H;
  }
  ctx.clearRect(0, 0, W, H);

  const minDB = -60, maxDB = 0;
  const segments = 30;
  const segH = (H * 0.88) / segments;
  const segGap = 1.5;
  const segW = W - 2;
  const offsetY = H * 0.06;

  for (let i = 0; i < segments; i++) {
    const segDB = minDB + (i / segments) * (maxDB - minDB);
    const y = H - offsetY - (i + 1) * segH + segGap / 2;
    const filled = valueDB > segDB;
    // ゾーン：通常=テーマ色 / loud=琥珀 / clip=紅
    let cs;
    const t = i / segments;
    if (t > 0.9)       cs = '255,72,110';
    else if (t > 0.75) cs = '255,186,96';
    else               cs = TH.s;
    ctx.fillStyle = 'rgba('+cs+','+(filled?0.9:0.08)+')';
    ctx.fillRect(1, y, segW, segH - segGap);
  }

  if (holdDB > minDB) {
    const holdNorm = (holdDB - minDB) / (maxDB - minDB);
    const holdY = H - offsetY - holdNorm * segments * segH;
    const ht = (holdDB - minDB) / (maxDB - minDB);
    let hs = TH.s;
    if (ht > 0.9) hs='255,72,110';
    else if (ht > 0.75) hs='255,186,96';
    ctx.fillStyle = 'rgba('+hs+',0.95)';
    ctx.fillRect(1, holdY - 1, segW, 2);
  }
}

// ── Main draw loop ──
function draw(ts) {
  requestAnimationFrame(draw);
  vzRafTs = ts || performance.now();
  if (!analyser) { updateTheme(-70); drawIdle(); return; }

  analyser.getByteTimeDomainData(dataArray);
  analyser.getByteFrequencyData(freqArray);

  let sum = 0;
  for (let i = 0; i < bufferLength; i++) { const v = (dataArray[i]/128)-1; sum += v*v; }
  const rms = Math.sqrt(sum / bufferLength);
  const db = rms > 0 ? Math.max(-60, 20 * Math.log10(rms)) : -60;
  const norm = (db + 60) / 60;

  let maxSamp = 0;
  for (let i = 0; i < bufferLength; i++) { const v = Math.abs((dataArray[i]/128)-1); if (v > maxSamp) maxSamp = v; }
  const peakDb = maxSamp > 0 ? Math.max(-60, 20 * Math.log10(maxSamp)) : -60;
  if (peakDb > peakDbHold) { peakDbHold = peakDb; peakDbTimer = 90; }
  else if (peakDbTimer > 0) peakDbTimer--;
  else peakDbHold = Math.max(-60, peakDbHold - 0.3);

  // Proper BS.1770-4 LUFS using stereo L/R
  let lufsAvg = -70;
  if (analyserL && analyserR) {
    const fLen = analyserL.fftSize;
    const fBufL = new Float32Array(fLen);
    const fBufR = new Float32Array(fLen);
    analyserL.getFloatTimeDomainData(fBufL);
    analyserR.getFloatTimeDomainData(fBufR);
    lufsAvg = calcLUFSProper(fBufL, fBufR, audioCtx.sampleRate);
    updateIntegratedLUFS(lufsAvg);
  } else {
    lufsAvg = calcLUFS(dataArray);
  }
  const lufsInt = intLufsVal;
  updateTheme(lufsAvg);

  let maxFIdx = 0, maxFVal = 0;
  for (let i = 1; i < bufferLength; i++) { if (freqArray[i] > maxFVal) { maxFVal = freqArray[i]; maxFIdx = i; } }
  const peakHz = Math.round(maxFIdx * (audioCtx.sampleRate || 44100) / analyser.fftSize);

  lufsVal.innerHTML = `${lufsAvg.toFixed(1)}<span class="meter-unit">LU</span>`;
  const lufsNorm = Math.max(0, Math.min(1, (lufsAvg + 70) / 55));
  lufsBar.style.width = (lufsNorm * 100) + '%';
  lufsBar.style.background = lufsAvg > -9 ? 'linear-gradient(90deg,#ff5d86,#ff2e62)'
    : lufsAvg > -14 ? 'linear-gradient(90deg,#8e6bff,#c79bff)'
    : 'linear-gradient(90deg,#79c8ff,#cfeeff)';
  lufsIntVal.textContent = `INT ${lufsInt.toFixed(1)}`;

  peakVal.innerHTML = `${peakDb > -0.1 ? '0.0' : peakDb.toFixed(1)}<span class="meter-unit">dB</span>`;
  peakVal.style.color = peakDb > -3 ? '#ff6e9e' : peakDb > -9 ? '#ffd98c' : '#fff';
  peakHoldVal.textContent = `HOLD ${peakDbHold > -0.1 ? '0.0' : peakDbHold.toFixed(1)}`;

  // Bar meters
  drawBarMeter(lbc, lufsBarCanvas, lufsAvg, lufsInt);
  drawBarMeter(pbc, peakBarCanvas, peakDb, peakDbHold);

  if (isPlaying && playlist[currentIndex] && !isDragging) {
    const elapsed = audioCtx.currentTime - startTime;
    const ratio = Math.min(elapsed / playlist[currentIndex].duration, 1);
    updateSeek(ratio);
  }

  // Scroll waveform buffer
  if (bufferLength) {
    const chunk = Math.floor(bufferLength / 16);
    for (let i = 0; i < chunk; i++) {
      wfBuffer[wfWrite % WF_BUF] = (dataArray[i] / 128) - 1;
      wfWrite++;
    }
  }
  drawScrollWaveform();
  // 変換の自己修復:例外等でリセットされても次フレームで直る
  ic.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (vizSwapped) {
    drawVizZoneToCtx(ic, cw(imagerCanvas), ch(imagerCanvas), norm, peakDb, lufsAvg);
  } else {
    drawImager();
  }
  drawEQ();
  drawFullWaveform();
}


// Draw imager content to any ctx/W/H — フォスファ(残光)風ベクタースコープ
function drawImagerToCtx(ctx, W, H) {
  if (!analyserL || !analyserR) { ctx.fillStyle='rgba(5,5,17,0.6)'; ctx.fillRect(0,0,W,H); return; }
  const cx=W/2, cy=H/2;
  // 透けるガラス + 残光：完全クリアせず減衰フィル
  ctx.fillStyle='rgba(5,5,17,0.5)'; ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba('+TH.sd+',0.5)'; ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(0,H);ctx.stroke();
  [0.25,0.5,0.75,1.0].forEach(r=>{
    ctx.beginPath();ctx.arc(cx,cy,r*cx*0.95,0,Math.PI*2);
    ctx.strokeStyle='rgba('+TH.sd+','+(r===1.0?0.6:0.25)+')';ctx.stroke();
  });
  ctx.fillStyle='rgba('+TH.sd+',0.95)'; ctx.font=`${Math.max(6,W*0.06)}px Share Tech Mono`;
  ctx.fillText('L',4,cy-2); ctx.fillText('R',W-10,cy-2);
  ctx.fillText('M',cx+2,10); ctx.fillText('S',cx+2,H-4);
  const len=analyserL.fftSize;
  const bL=new Float32Array(len), bR=new Float32Array(len);
  analyserL.getFloatTimeDomainData(bL); analyserR.getFloatTimeDomainData(bR);
  // 小窓(スワップ先42px)では点を間引いてノイズの塊化を防ぐ
  const smallSc = W < 60;
  const step=Math.max(1,Math.floor(len/(smallSc?192:512)));
  // ソフトクランプ:音圧が高い瞬間でも点が枠の外へ飛び出さんように圧縮
  const sc=v=>v/(1+Math.abs(v)*0.45);
  const dotR=smallSc?0.6:0.8, dotS=dotR*2;
  for(let i=0;i<len;i+=step){
    const l=bL[i],r=bR[i];
    const x=cx+sc((l-r)*0.85)*cx, y=cy-sc((l+r)*0.85)*cy;
    const amp=Math.abs(l)+Math.abs(r), alpha=Math.min(1,amp*3+0.05);
    const t2=Math.min(1,amp*2);
    // 弱い点=テーマ色 → 強い点=白熱
    const dr=Math.round(TH.r+(255-TH.r)*t2), dg=Math.round(TH.g+(255-TH.g)*t2), db2=Math.round(TH.b+(255-TH.b)*t2);
    ctx.fillStyle=`rgba(${dr},${dg},${db2},${alpha})`;
    ctx.fillRect(x-dotR,y-dotR,dotS,dotS);
  }
  // Correlation bar
  let sLL=0,sRR=0,sLR=0;
  for(let i=0;i<len;i++){sLL+=bL[i]*bL[i];sRR+=bR[i]*bR[i];sLR+=bL[i]*bR[i];}
  const corr=(sLL+sRR)>0?sLR/Math.sqrt(sLL*sRR+1e-10):0;
  const cn=(corr+1)/2, bY=H-6, bH2=3, bP=6, bW2=W-bP*2;
  ctx.fillStyle='rgba('+TH.sd+',0.55)'; ctx.fillRect(bP,bY,bW2,bH2);
  ctx.fillStyle=corr>0?'rgba('+TH.s+',0.85)':`rgba(${Math.round(120+(-corr)*135)},80,110,0.85)`;
  ctx.fillRect(bP,bY,cn*bW2,bH2);
  ctx.fillStyle='#fff'; ctx.fillRect(bP+cn*bW2-1,bY-1,2,bH2+2);
}

function drawImager() {
  const W = cw(imagerCanvas), H = ch(imagerCanvas);
  if (!W || !H) return;
  drawImagerToCtx(ic, W, H);
}


const EQ_FREQS = [20,50,100,200,500,1000,2000,5000,10000,20000];
const EQ_LABELS = ['20','50','100','200','500','1k','2k','5k','10k','20k'];
function freqToX(f, W) {
  const logMin=Math.log10(20), logMax=Math.log10(20000);
  return ((Math.log10(f)-logMin)/(logMax-logMin))*W;
}
function drawEQ() {
  const W=cw(eqCanvas), H=ch(eqCanvas);
  const sampleRate=audioCtx?audioCtx.sampleRate:44100;
  const nyq=sampleRate/2;
  // 上端に余白:0dBの線とラベルが縁で切れんように
  const TOP=14;
  const dbY=db=>TOP+(1-(db+60)/60)*(H-TOP);
  ec.clearRect(0,0,W,H);
  ec.fillStyle='rgba(5,6,18,0.40)'; ec.fillRect(0,0,W,H);
  const dbLines=[-60,-48,-36,-24,-12,0];
  dbLines.forEach(d=>{
    const y=dbY(d);
    ec.beginPath(); ec.moveTo(0,y); ec.lineTo(W,y);
    ec.strokeStyle=d===0?'rgba('+TH.s+',0.22)':'rgba('+TH.sd+',0.30)';
    ec.lineWidth=d===0?1:0.5; ec.stroke();
    if(d>-60){ ec.fillStyle='rgba('+TH.sd+',0.9)'; ec.font='8px Share Tech Mono'; ec.fillText(d+'dB',2,y-2); }
  });
  EQ_FREQS.forEach((f,i)=>{
    const x=freqToX(f,W);
    ec.beginPath(); ec.moveTo(x,0); ec.lineTo(x,H);
    ec.strokeStyle='rgba('+TH.sd+',0.30)'; ec.lineWidth=0.5; ec.stroke();
    ec.fillStyle='rgba('+TH.sd+',0.95)'; ec.font='8px Share Tech Mono'; ec.fillText(EQ_LABELS[i],x+2,H-2);
  });
  ec.beginPath(); let started=false;
  for(let i=1;i<bufferLength;i++){
    const f=i*nyq/bufferLength;
    if(f<20||f>20000) continue;
    const x=freqToX(f,W);
    const db=freqArray[i]/255*60-60;
    const y=dbY(db);
    if(!started){ec.moveTo(x,H);ec.lineTo(x,y);started=true;} else ec.lineTo(x,y);
  }
  ec.lineTo(W,H); ec.closePath();
  const grad=ec.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba('+TH.s+',0.45)');
  grad.addColorStop(0.5,'rgba('+TH.s2+',0.18)');
  grad.addColorStop(1,'rgba('+TH.sd+',0.04)');
  ec.fillStyle=grad; ec.fill();
  ec.beginPath(); started=false;
  for(let i=1;i<bufferLength;i++){
    const f=i*nyq/bufferLength;
    if(f<20||f>20000) continue;
    const x=freqToX(f,W);
    const db=freqArray[i]/255*60-60;
    const y=dbY(db);
    if(!started){ec.moveTo(x,y);started=true;} else ec.lineTo(x,y);
  }
  ec.strokeStyle='rgba('+TH.s+',0.9)'; ec.lineWidth=1.5; ec.stroke();
}

// ── Helpers defined ONCE outside draw ──
const _vtmp = new Float32Array(3);
function vzRot(out, x, y, z, cX,sX,cY,sY,cZ,sZ) {
  const y1=y*cX-z*sX, z1=y*sX+z*cX;
  const x2=x*cY+z1*sY, z2=-x*sY+z1*cY;
  out[0]=x2*cZ-y1*sZ; out[1]=x2*sZ+y1*cZ; out[2]=z2;

const VZ_C_MAG    = [255,120,225];
const VZ_C_WHITE  = [238,246,255];
function vzMix(a, b, t) {
  const u = t<0?0:t>1?1:t;
  return ((a[0]+(b[0]-a[0])*u)|0)+','+((a[1]+(b[1]-a[1])*u)|0)+','+((a[2]+(b[2]-a[2])*u)|0);
}

// 正二十面体（頂点12 / 辺30）を一度だけ構築
const VZ_ICO_V = (() => {
  const p = (1+Math.sqrt(5))/2, L = Math.hypot(1,p);
  const v = [[-1,p,0],[1,p,0],[-1,-p,0],[1,-p,0],
             [0,-1,p],[0,1,p],[0,-1,-p],[0,1,-p],
             [p,0,-1],[p,0,1],[-p,0,-1],[-p,0,1]];
  return v.map(a => [a[0]/L, a[1]/L, a[2]/L]);
})();
const VZ_ICO_E = (() => {
  const e = [];
  for (let i=0;i<12;i++) for (let j=i+1;j<12;j++) {
    const a=VZ_ICO_V[i], b=VZ_ICO_V[j];
    if (Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]) < 1.2) e.push([i,j]);
  }
  return e;
})();
const _icoPX = new Float32Array(12), _icoPY = new Float32Array(12), _icoPZ = new Float32Array(12);

// デプスシェーディング付きシェル描画：奥の辺ほど暗く細く、色は氷→紫へ
function vzDrawIco(ctx, size, ox,oy,oz, fov, cX,sX,cY,sY,cZ,sZ, alpha, lw) {
  let zmin=Infinity, zmax=-Infinity;
  for (let v=0; v<12; v++) {
    vzRot(_vtmp, VZ_ICO_V[v][0]*size, VZ_ICO_V[v][1]*size, VZ_ICO_V[v][2]*size, cX,sX,cY,sY,cZ,sZ);
    const ppz=_vtmp[2]+oz, den=fov+ppz;
    const s = den>0 ? fov/den : 0;
    _icoPX[v]=ox+_vtmp[0]*s; _icoPY[v]=oy+_vtmp[1]*s; _icoPZ[v]=ppz;
    if(ppz<zmin)zmin=ppz; if(ppz>zmax)zmax=ppz;
  }
  const zr = (zmax-zmin)||1;
  for (const [i,j] of VZ_ICO_E) {
    const zn = ((_icoPZ[i]+_icoPZ[j])*0.5 - zmin)/zr; // 0=手前 1=奥
    ctx.beginPath();
    ctx.moveTo(_icoPX[i],_icoPY[i]); ctx.lineTo(_icoPX[j],_icoPY[j]);
    ctx.strokeStyle = 'rgba('+vzMix(VZ_C_ICE, VZ_C_VIOLET, zn*1.15)+','+(alpha*(1-zn*0.68)).toFixed(3)+')';
    ctx.lineWidth = lw*(1.18-zn*0.55);
    ctx.stroke();
  }
}

// 磁性流体コア：球面ノイズ歪み + 3段階デプスバケットでまとめて描画
const VZ_SLICES = 10, VZ_STACKS = 10;
const _flN = (VZ_STACKS+1)*(VZ_SLICES+1);
const _flX = new Float32Array(_flN), _flY = new Float32Array(_flN), _flZ = new Float32Array(_flN);
function vzDrawFluid(ctx, size, ox, oy, oz, fov, cX,sX,cY,sY,cZ,sZ, alpha, distort, t) {
  const rows=VZ_STACKS, cols=VZ_SLICES;
  let zmin=Infinity, zmax=-Infinity;
  for (let ri=0; ri<=rows; ri++) {
    const phi=(ri/rows)*Math.PI, sp=Math.sin(phi), cp=Math.cos(phi);
    for (let si=0; si<=cols; si++) {
      const theta=(si/cols)*Math.PI*2;
      let x=sp*Math.cos(theta), y=cp, z=sp*Math.sin(theta);
      if (distort>0) {
        const n1=Math.sin(x*5.1+t*1.3)*Math.cos(y*4.7+t*0.9)*Math.sin(z*3.3+t*1.7);
        const n2=Math.cos(x*3.1+t*2.1)*Math.sin(y*6.3+t*1.1)*Math.cos(z*4.9+t*2.3);
        const n3=Math.sin(x*7.3+t*0.7)*Math.cos(z*5.1+t*1.5)*Math.sin(y*2.9+t*3.1);
        const n4=Math.cos(x*2.3+t*3.3)*Math.sin(z*7.7+t*0.5)*Math.cos(y*6.1+t*1.9);
        const spike=1+distort*(2.5*Math.abs(n1)+1.8*Math.abs(n2)+1.2*Math.abs(n3)+0.8*Math.abs(n4));
        x*=spike; y*=spike; z*=spike;
      }
      vzRot(_vtmp, x*size, y*size, z*size, cX,sX,cY,sY,cZ,sZ);
      const idx=ri*(cols+1)+si, ppz=_vtmp[2]+oz, den=fov+ppz;
      const s=den>0?fov/den:0;
      _flX[idx]=ox+_vtmp[0]*s; _flY[idx]=oy+_vtmp[1]*s; _flZ[idx]=ppz;
      if(ppz<zmin)zmin=ppz; if(ppz>zmax)zmax=ppz;
    }
  }
  const zr=(zmax-zmin)||1;
  const paths=[new Path2D(), new Path2D(), new Path2D()];
  const seg=(a,b)=>{ const zn=((_flZ[a]+_flZ[b])*0.5-zmin)/zr;
    const p=paths[zn<0.34?0:zn<0.67?1:2];
    p.moveTo(_flX[a],_flY[a]); p.lineTo(_flX[b],_flY[b]); };
  for (let ri=0; ri<=rows; ri++) for (let si=0; si<cols; si++) {
    const a=ri*(cols+1)+si; seg(a, a+1);                       // 緯線
    if (ri<rows) seg(a, a+cols+1);                             // 経線
  }
  ctx.lineWidth=0.7;
  ctx.strokeStyle='rgba('+vzMix(VZ_C_WHITE,VZ_C_ICE,0.3)+','+(alpha).toFixed(3)+')';        ctx.stroke(paths[0]);
  ctx.strokeStyle='rgba('+vzMix(VZ_C_ICE,VZ_C_VIOLET,0.5)+','+(alpha*0.55).toFixed(3)+')';  ctx.stroke(paths[1]);
  ctx.strokeStyle='rgba('+VZ_C_VIOLET.join(',')+','+(alpha*0.22).toFixed(3)+')';            ctx.stroke(paths[2]);
}

// 星屑パーティクル（単位座標で一度だけ生成）
const VZ_PARTS = (() => {
  const arr=[];
  for (let i=0;i<64;i++) {
    const a=Math.random()*Math.PI*2, b=Math.acos(Math.random()*2-1);
    const r=0.55+Math.random()*0.45;
    arr.push({ x:Math.sin(b)*Math.cos(a)*r, y:(Math.cos(b)*0.62)*r, z:Math.sin(b)*Math.sin(a)*r,
               tw:Math.random()*Math.PI*2, sp:0.6+Math.random()*0.8 });
  }
  return arr;
})();

// キックで放つショックウェーブ
const vzShocks = [];

function drawVizZoneToCtx(ctx, W, H, norm, peakDb, lufsDb) {
  ctx.save(); // 内部で例外が起きても変換が壊れんようにfinallyで必ず復元
  try {
  const now = vzRafTs || performance.now();
  const dt = vzLastTime ? Math.min((now - vzLastTime) / 1000, 0.05) : 0.016;
  vzLastTime = now;
  vzTime += dt;
  const t = vzTime;
  const fArr = (typeof freqArray !== 'undefined' && freqArray) ? freqArray : null;
  const bLen = (typeof bufferLength !== 'undefined' && bufferLength) ? bufferLength : 0;
  const energy = Math.max(0, Math.min(1, ((peakDb||-60)+60)/60));
  const bass = fArr && bLen > 4 ? fArr[2]/255 : energy*0.5;
  const minWH = Math.min(W,H);
  const small = minWH < 140;                  // スワップ先の小キャンバスでは間引く
  const cx=W/2, cyv=H*0.485, fov=minWH*1.6;

  // 150-200Hz キック検出
  let kick100=0;
  if(fArr&&bLen>0&&(typeof audioCtx!=='undefined')&&audioCtx){
    const nyq=(audioCtx.sampleRate||44100)/2;
    const i1=Math.round(150/nyq*bLen), i2=Math.round(200/nyq*bLen);
    let s=0,c=0;
    for(let i=i1;i<=Math.min(i2,bLen-1);i++){s+=fArr[i];c++;}
    kick100=c>0?s/c/255:0;
  }

  // LUFS派生パラメータ（momentary・しきい値は従来値）
  const lufsRaw=(lufsDb&&lufsDb>-70)?lufsDb:-70;
  const targetGlow    = Math.max(0,Math.min(1,(lufsRaw+8.5)/5.5));
  const targetDistort = Math.max(0,Math.min(1,(lufsRaw+5.5)/5.5));
  const targetSpeed   = Math.max(0.08,Math.min(1,(lufsRaw+70)/68));
  const lerpK = 1 - Math.pow(0.008, dt);
  vzSmLufsGlow   += (targetGlow    - vzSmLufsGlow)   * lerpK;
  vzSmSatDistort += (targetDistort - vzSmSatDistort) * lerpK;
  // 速度：上昇は素早く、下降は超ゆっくり（約60秒）
  const speedUp   = 1 - Math.pow(0.15, dt);
  const speedDown = 1 - Math.pow(0.001, dt);
  const speedK = targetSpeed > vzSmSpeedScale ? speedUp : speedDown;
  vzSmSpeedScale += (targetSpeed - vzSmSpeedScale) * speedK;
  const lufsGlow   = vzSmLufsGlow;
  const coreDistort= vzSmSatDistort;
  const sp         = vzSmSpeedScale;

  // キックエネルギー + ショックウェーブ生成
  const bd=kick100-vzPrevBass;
  if(bd>0.12){
    vzKickEnergy=Math.min(1,vzKickEnergy+bd*2);
    const young = vzShocks.length && vzShocks[vzShocks.length-1].r < 0.38;
    if(vzShocks.length<3 && vzKickEnergy>0.3 && !young) vzShocks.push({r:0.27, a:0.28+lufsGlow*0.22});
  }
  vzPrevBass=kick100*0.3+vzPrevBass*0.7;
  vzKickEnergy*=0.93;
  vzSmBass += (bass - vzSmBass) * (1 - Math.pow(0.01, dt));
  const baseS=minWH*0.21, maxS=minWH*0.30;
  vzKickScale=Math.min(maxS/baseS, 1 + vzSmBass * 0.35);

  // 背景：残像フェード + ごく薄いビネット
  ctx.fillStyle='rgba(5,3,16,0.32)'; ctx.fillRect(0,0,W,H);

  // 角度積み上げ
  vzAngX += dt * 0.32 * sp;
  vzAngY += dt * 0.23 * sp;
  vzAngZ += dt * 0.12 * sp;
  const cX=Math.cos(vzAngX),sX=Math.sin(vzAngX);
  const cY=Math.cos(vzAngY),sY=Math.sin(vzAngY);
  const cZ=Math.cos(vzAngZ),sZ=Math.sin(vzAngZ);
  const ms=baseS*vzKickScale, md=minWH*0.3;

  // 星屑（Y軸だけ回す軽量パララックス）
  if(!small){
    const pa=vzAngY*0.25, pc=Math.cos(pa), ps=Math.sin(pa), pr=minWH*0.62;
    for(const p of VZ_PARTS){
      const x=p.x*pc+p.z*ps, z=-p.x*ps+p.z*pc;
      const ppz=z*pr+md, den=fov+ppz; if(den<=0) continue;
      const s=fov/den, sx2=cx+x*pr*s, sy2=cyv+p.y*pr*s;
      const depth=1-Math.max(0,Math.min(1,(ppz+pr)/(pr*2)));
      const twk=0.5+0.5*Math.sin(t*p.sp*2+p.tw);
      const a=(0.05+depth*0.22)*(0.45+energy*0.55)*(0.5+twk*0.5);
      const d=Math.max(1, (0.8+depth*1.4)*(minWH/320));
      ctx.fillStyle='rgba('+vzMix(VZ_C_ICE,VZ_C_VIOLET,1-depth)+','+a.toFixed(3)+')';
      ctx.fillRect(sx2,sy2,d,d);
    }
  }

  // コアグロー（LUFS + キック）
  if(lufsGlow>0.02||vzKickEnergy>0.05){
    const g=lufsGlow*0.55+vzKickEnergy*0.3, gr=ms*(1.1+lufsGlow*0.7);
    const grd=ctx.createRadialGradient(cx,cyv,0,cx,cyv,gr);
    grd.addColorStop(0,'rgba(190,150,255,'+(g*0.4).toFixed(3)+')');
    grd.addColorStop(0.55,'rgba(120,90,230,'+(g*0.12).toFixed(3)+')');
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx,cyv,gr,0,Math.PI*2); ctx.fill();
  }

  // アナモルフィックフレア（横一文字の光条）
  if(lufsGlow>0.03){
    const fw=W*(0.35+lufsGlow*0.65), fh=Math.max(1.5, minWH*0.012*(0.4+lufsGlow+vzKickEnergy*0.5));
    const fg=ctx.createLinearGradient(cx-fw/2,0,cx+fw/2,0);
    const fa=(0.10+lufsGlow*0.28+vzKickEnergy*0.15).toFixed(3);
    fg.addColorStop(0,'rgba(150,240,255,0)');
    fg.addColorStop(0.5,'rgba(235,246,255,'+fa+')');
    fg.addColorStop(1,'rgba(168,140,252,0)');
    ctx.fillStyle=fg; ctx.fillRect(cx-fw/2, cyv-fh/2, fw, fh);
    ctx.fillStyle='rgba(255,255,255,'+(lufsGlow*0.22).toFixed(3)+')';
    ctx.fillRect(cx-fw*0.32, cyv-0.5, fw*0.64, 1);
  }

  // ショックウェーブ更新・描画
  for(let i=vzShocks.length-1;i>=0;i--){
    const sw=vzShocks[i];
    sw.r += dt*(0.72+vzKickEnergy*0.25);
    sw.a *= Math.pow(0.008, dt);
    if(sw.a<0.01 || sw.r>0.9){ vzShocks.splice(i,1); continue; }
    ctx.beginPath(); ctx.arc(cx,cyv,sw.r*minWH,0,Math.PI*2);
    ctx.strokeStyle='rgba('+vzMix(VZ_C_ICE,VZ_C_MAG,1-sw.a*2)+','+sw.a.toFixed(3)+')';
    ctx.lineWidth=Math.max(0.6, 2.2*sw.a*(minWH/320)+0.4);
    ctx.stroke();
  }

  // 放射状ミラースペクトラム（コアを囲むリング）
  if(fArr&&bLen>0&&!small){
    const bars=48, half=bars/2, r0=minWH*0.315, lmax=minWH*0.095;
    const rot=-Math.PI/2 + vzAngZ*0.4;
    ctx.lineWidth=Math.max(1, minWH*0.006);
    ctx.lineCap='round';
    for(let i=0;i<bars;i++){
      const j=i<half?i:bars-1-i;
      const fi=Math.min(Math.floor(Math.pow(j/half,1.6)*bLen*0.5), bLen-1);
      const fv=fArr[fi]/255;
      const ang=rot+(i/bars)*Math.PI*2;
      const ca=Math.cos(ang), sa=Math.sin(ang);
      const len=1+Math.pow(fv,1.5)*lmax;
      ctx.beginPath();
      ctx.moveTo(cx+ca*r0, cyv+sa*r0);
      ctx.lineTo(cx+ca*(r0+len), cyv+sa*(r0+len));
      ctx.strokeStyle='rgba('+vzMix(VZ_C_ICE,VZ_C_MAG,fv*1.2-0.1)+','+(0.10+fv*0.55).toFixed(3)+')';
      ctx.stroke();
    }
    ctx.lineCap='butt';
    // ベースライン
    ctx.beginPath(); ctx.arc(cx,cyv,r0-1,0,Math.PI*2);
    ctx.strokeStyle='rgba(150,240,255,'+(0.05+energy*0.06).toFixed(3)+')';
    ctx.lineWidth=0.7; ctx.stroke();
  }

  // 軌道リング + コメット（旧サテライトの公転角を継承）
  {
    vzSatRX[0] += dt*0.10*sp; vzSatRY[0] += dt*0.07*sp;
    const rcX=Math.cos(vzSatRX[0]+0.9), rsX=Math.sin(vzSatRX[0]+0.9);
    const rcY=Math.cos(vzSatRY[0]),     rsY=Math.sin(vzSatRY[0]);
    const R=minWH*0.36, steps=small?28:56;
    ctx.beginPath();
    for(let k=0;k<=steps;k++){
      const a=(k/steps)*Math.PI*2;
      vzRot(_vtmp, Math.cos(a)*R, 0, Math.sin(a)*R, rcX,rsX,rcY,rsY,1,0);
      const ppz=_vtmp[2]+md, den=fov+ppz; if(den<=0) continue;
      const s=fov/den, px2=cx+_vtmp[0]*s, py2=cyv+_vtmp[1]*s;
      k===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
    }
    ctx.strokeStyle='rgba(168,140,252,'+(0.07+energy*0.10).toFixed(3)+')';
    ctx.lineWidth=0.7; ctx.stroke();
    // コメット×3：中域に脈動、短いトレイル付き
    const trail=small?3:7;
    for(let i=0;i<3;i++){
      vzSatAng[i] += dt*(0.55+i*0.08)*sp;
      const mid=fArr&&bLen>0?fArr[Math.min(Math.floor(bLen*0.08)+i*6,bLen-1)]/255:energy*0.4;
      const base=vzSatAng[i]+(i/3)*Math.PI*2;
      for(let k=trail;k>=0;k--){
        const a=base-k*0.045;
        vzRot(_vtmp, Math.cos(a)*R, 0, Math.sin(a)*R, rcX,rsX,rcY,rsY,1,0);
        const ppz=_vtmp[2]+md, den=fov+ppz; if(den<=0) continue;
        const s=fov/den, px2=cx+_vtmp[0]*s, py2=cyv+_vtmp[1]*s;
        const fade=1-k/(trail+1);
        const rad=(k===0 ? (1.6+mid*2.6) : (0.5+fade*1.2))*(minWH/320)*s*1.4;
        ctx.beginPath(); ctx.arc(px2,py2,Math.max(0.4,rad),0,Math.PI*2);
        ctx.fillStyle = k===0
          ? 'rgba('+vzMix(VZ_C_WHITE, i%2?VZ_C_ICE:VZ_C_VIOLET, 0.35)+','+(0.5+mid*0.5).toFixed(3)+')'
          : 'rgba('+vzMix(VZ_C_ICE,VZ_C_VIOLET,i/3)+','+(fade*fade*(0.25+mid*0.3)).toFixed(3)+')';
        ctx.fill();
      }
    }
  }

  // ガラスシェル本体 + ゴースト（二重像）
  vzDrawIco(ctx, ms, cx,cyv,md, fov, cX,sX,cY,sY,cZ,sZ,
    0.30+lufsGlow*0.45+vzKickEnergy*0.2, 0.8+lufsGlow*0.9+vzKickEnergy*1.2);
  vzDrawIco(ctx, ms*1.14, cx,cyv,md, fov, cX,-sX,cY,-sY,cZ,sZ,
    0.07+lufsGlow*0.10, 0.6);

  // 磁性流体コア：bassに直接反応（従来ロジック維持）
  const targetInnerMod = Math.max(0, Math.min(1, (lufsRaw + 7) / 4));
  vzSmInnerMod += (targetInnerMod - vzSmInnerMod) * (1 - Math.pow(0.02, dt));
  const innerScale = 0.25 + bass * (0.1 + vzSmInnerMod * 0.4);
  vzDrawFluid(ctx, ms*innerScale, cx,cyv,md, fov,
    Math.cos(-vzAngX*0.8),Math.sin(-vzAngX*0.8),
    Math.cos(-vzAngY*0.6),Math.sin(-vzAngY*0.6),
    Math.cos(vzAngZ*0.9), Math.sin(vzAngZ*0.9),
    0.45+energy*0.25+vzKickEnergy*0.2, coreDistort, t);

  // 強いbassで4点グリント
  if(bass>0.6){
    const fa=(bass-0.6)/0.4, gl=minWH*0.10*fa;
    ctx.save(); ctx.translate(cx,cyv); ctx.rotate(t*0.6);
    ctx.strokeStyle='rgba(255,255,255,'+(fa*0.55).toFixed(3)+')'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(-gl,0); ctx.lineTo(gl,0); ctx.moveTo(0,-gl); ctx.lineTo(0,gl);
    ctx.stroke();
    const ds=gl*0.18;
    ctx.beginPath(); ctx.moveTo(0,-ds); ctx.lineTo(ds,0); ctx.lineTo(0,ds); ctx.lineTo(-ds,0);
    ctx.closePath(); ctx.fillStyle='rgba(255,225,255,'+(fa*0.7).toFixed(3)+')'; ctx.fill();
    ctx.restore();
  }

  // HUD：細いコーナーブラケット
  const ha=(0.12+energy*0.3).toFixed(3), bs2=minWH*0.05;
  ctx.strokeStyle='rgba(168,200,255,'+ha+')'; ctx.lineWidth=1;
  [[5,5,1,1],[W-5,5,-1,1],[5,H-5,1,-1],[W-5,H-5,-1,-1]].forEach(([bx,by,sx2,sy2])=>{
    ctx.beginPath(); ctx.moveTo(bx,by+sy2*bs2); ctx.lineTo(bx,by); ctx.lineTo(bx+sx2*bs2,by); ctx.stroke();
  });
  } catch(e) { /* silent */ }
  finally { ctx.restore(); }
}






// ── Scrolling live waveform (vertical, right panel) ──
function drawScrollWaveform() {
  if (!wc || !wfCanvas) return;
  const W = cw(wfCanvas), H = ch(wfCanvas);
  if (!W || !H) return;

  wc.clearRect(0, 0, W, H);

  // Center line
  wc.beginPath(); wc.moveTo(W/2, 0); wc.lineTo(W/2, H);
  wc.strokeStyle = 'rgba('+TH.s+',0.08)'; wc.lineWidth = 0.5; wc.stroke();

  // Draw waveform - horizontal bars scrolling downward
  const step = WF_BUF / H;
  for (let y = 0; y < H; y++) {
    const idx = (wfWrite - WF_BUF + Math.floor(y * step) + WF_BUF) % WF_BUF;
    const v = Math.abs(wfBuffer[idx]);
    const barW = Math.max(1, v * (W / 2 - 2));
    const age = y / H;
    const alpha = 0.15 + age * 0.7;
    wc.fillStyle = 'rgba('+TH.s+','+alpha.toFixed(3)+')';
    wc.fillRect(W/2 - barW, y, barW * 2, 1);
  }

  // Playhead at bottom
  wc.beginPath(); wc.moveTo(0, H-1); wc.lineTo(W, H-1);
  wc.strokeStyle = 'rgba('+TH.s+',0.4)'; wc.lineWidth = 1; wc.stroke();
}

// ── Full-song waveform cache ──
let wfPeaks = null; // pre-computed peaks for current track

function buildWaveformPeaks() {
  if (!playlist[currentIndex]) { wfPeaks = null; return; }
  const buf = playlist[currentIndex].buffer;
  const ch0 = buf.getChannelData(0);
  const ch1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : ch0;
  const W = seekWfCanvas ? Math.round(cw(seekWfCanvas)) : 300;
  const step = Math.max(1, Math.floor(ch0.length / W));
  wfPeaks = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    let max = 0;
    const start = x * step;
    for (let i = start; i < start + step && i < ch0.length; i++) {
      const v = Math.abs((ch0[i] + ch1[i]) * 0.5);
      if (v > max) max = v;
    }
    wfPeaks[x] = max;
  }
}

function drawFullWaveform() {
  if (!swc || !seekWfCanvas) return;
  const W = Math.round(cw(seekWfCanvas)), H = ch(seekWfCanvas);
  swc.clearRect(0, 0, W, H);
  // Center line
  swc.beginPath(); swc.moveTo(0, H/2); swc.lineTo(W, H/2);
  swc.strokeStyle = 'rgba('+TH.s+',0.1)'; swc.lineWidth = 0.5; swc.stroke();

  if (!wfPeaks) return;

  const ratio = isPlaying ? Math.min((audioCtx.currentTime - startTime) / playlist[currentIndex].duration, 1)
                           : (playlist[currentIndex] ? pauseOffset / playlist[currentIndex].duration : 0);

  const playX = Math.floor(ratio * W);

  const xMax = Math.min(W, wfPeaks.length);
  for (let x = 0; x < xMax; x++) {
    const peak = wfPeaks[x];
    const barH = Math.max(1, peak * (H / 2 - 3));
    swc.fillStyle = x < playX ? 'rgba('+TH.s+',0.75)' : 'rgba('+TH.s+',0.18)';
    swc.fillRect(x, H/2 - barH, 1, barH * 2);
  }

  // Playhead glow
  if (playX > 0 && playX < W) {
    const pg = swc.createLinearGradient(playX - 8, 0, playX + 2, 0);
    pg.addColorStop(0, 'rgba('+TH.s+',0)');
    pg.addColorStop(1, 'rgba('+TH.s+',0.15)');
    swc.fillStyle = pg;
    swc.fillRect(playX - 8, 0, 10, H);
    swc.beginPath(); swc.moveTo(playX, 0); swc.lineTo(playX, H);
    swc.strokeStyle = 'rgba('+TH.s+',0.8)'; swc.lineWidth = 1.5; swc.stroke();
  }
}

function drawIdle() {
  const W=cw(imagerCanvas), H=ch(imagerCanvas);
  if(!W||!H) return;
  const cx=W/2,cy=H/2;
  ic.fillStyle='rgba(4,4,14,0.18)'; ic.fillRect(0,0,W,H);
  ic.strokeStyle='rgba('+TH.sd+',0.4)'; ic.lineWidth=0.5;
  ic.beginPath(); ic.moveTo(cx,0); ic.lineTo(cx,H); ic.stroke();
  ic.beginPath(); ic.moveTo(0,cy); ic.lineTo(W,cy); ic.stroke();
  ic.beginPath(); ic.moveTo(0,0); ic.lineTo(W,H); ic.stroke();
  ic.beginPath(); ic.moveTo(W,0); ic.lineTo(0,H); ic.stroke();
  ic.beginPath(); ic.arc(cx,cy,cx*0.95,0,Math.PI*2);
  ic.strokeStyle='rgba('+TH.sd+',0.5)'; ic.stroke();
  const eW=cw(eqCanvas), eH=ch(eqCanvas);
  if(eW&&eH){ ec.clearRect(0,0,eW,eH); ec.fillStyle='rgba(5,6,18,0.40)'; ec.fillRect(0,0,eW,eH); ec.beginPath(); ec.moveTo(0,eH/2); ec.lineTo(eW,eH/2); ec.strokeStyle='rgba('+TH.sd+',0.3)'; ec.lineWidth=0.5; ec.stroke(); }
  if (seekWfCanvas && swc) {
    const wW=cw(seekWfCanvas), wH=ch(seekWfCanvas);
    if(wW&&wH){ swc.clearRect(0,0,wW,wH); swc.beginPath(); swc.moveTo(0,wH/2); swc.lineTo(wW,wH/2); swc.strokeStyle='rgba('+TH.s+',0.1)'; swc.lineWidth=0.5; swc.stroke(); }
  }
  if (wfCanvas && wc) { wc.clearRect(0,0,cw(wfCanvas),ch(wfCanvas)); }
}

draw();

// ── Viz swap ──
// DOM・サイズ・レイアウトは一切変えない。
// タップするたびに「どちらのcanvasに何を描くか」だけを切り替える。
let vizSwapped = false;

function onVizTap(e) {
  e.preventDefault();
  e.stopPropagation();
  vizSwapped = !vizSwapped;
}

(function attachSwapHandlers() {
  const vw = document.querySelector('.viz-wrap');
  if (vw) {
    vw.addEventListener('click', onVizTap);
    vw.addEventListener('touchend', onVizTap, {passive: false});
  }
})();


if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

</script>
